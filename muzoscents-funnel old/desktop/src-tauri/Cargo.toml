[package]
name = "kevs-digital-bos"
version = "1.0.0"
description = "Kevs Digital bOS desktop shell"
authors = ["Kevs Digital"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kevs_digital_bos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# TEMPORARY: "devtools" enables the inspector in RELEASE builds.
# Remove that feature and the matching block in lib.rs's .setup()
# before shipping the final production build.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
btleplug = "0.11"
tokio = { version = "1", features = ["time"] }

[features]
default = []
