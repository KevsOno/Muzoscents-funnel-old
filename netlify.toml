[build]
  command = "cd netlify/functions && npm install || echo 'No dependencies to install'"
  publish = "muzoscents-funnel old"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Core Security Headers
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"

    # Fixes for missing headers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-ancestors 'none';"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Modern Cross-Origin Headers
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
