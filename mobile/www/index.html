<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kevs Digital bOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0F172A;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #appFrame {
      display: none;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0F172A;
    }
    #appFrame.active {
      display: block;
    }
    #offlineView {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    #offlineView.hidden {
      display: none;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #1E293B;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 28px 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .logo-wrap {
      width: 96px;
      height: 96px;
      border-radius: 20px;
      margin: 0 auto 16px;
      padding: 10px;
      background: #0F172A;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; line-height: 1.5; color: #CBD5E1; margin-bottom: 20px; }
    .status {
      font-size: 12px;
      color: #94A3B8;
      background: rgba(15, 23, 42, 0.65);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 20px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      background: #2563EB;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="camera; geolocation; clipboard-read; clipboard-write"></iframe>
  <div id="offlineView">
    <div class="card">
      <div class="logo-wrap">
        <img src="icon.png" alt="Kevs Digital bOS" class="logo" />
      </div>
      <h1>Kevs Digital bOS</h1>
      <p id="message">No active internet connection right now. Connect to Wi-Fi or mobile data to reach your workspace.</p>
      <div id="status" class="status">Offline mode active</div>
      <button id="retryBtn" type="button">Retry Connection</button>
    </div>
  </div>
  <script>
    const TARGET_URL = "https://kevsbos.netlify.app/kdsiginin";
    const appFrame = document.getElementById("appFrame");
    const offlineView = document.getElementById("offlineView");
    const messageEl = document.getElementById("message");
    const statusEl = document.getElementById("status");
    const retryBtn = document.getElementById("retryBtn");
    let loadTimer = null;

    function showOffline(msg, statusText) {
      clearTimeout(loadTimer);
      appFrame.classList.remove("active");
      appFrame.removeAttribute("src");
      offlineView.classList.remove("hidden");
      retryBtn.disabled = false;
      messageEl.textContent = msg;
      statusEl.textContent = statusText;
    }

    function loadInApp() {
      clearTimeout(loadTimer);
      if (!navigator.onLine) {
        showOffline(
          "No active internet connection right now. Connect to Wi-Fi or mobile data to reach your workspace.",
          "Offline mode active"
        );
        return;
      }

      retryBtn.disabled = true;
      messageEl.textContent = "Loading workspace inside Kevs Digital bOS...";
      statusEl.textContent = "Connecting to workspace...";

      appFrame.onload = () => {
        clearTimeout(loadTimer);
        offlineView.classList.add("hidden");
        appFrame.classList.add("active");
      };
      appFrame.onerror = () => {
        showOffline(
          "Unable to load workspace right now. Check your connection and try again.",
          "Connection interrupted"
        );
      };

      loadTimer = setTimeout(() => {
        if (!appFrame.classList.contains("active")) {
          showOffline(
            "Workspace took too long to respond. Check your connection and try again.",
            "Connection timed out"
          );
        }
      }, 10000);

      appFrame.src = TARGET_URL;
    }

    retryBtn.addEventListener("click", loadInApp);
    window.addEventListener("online", loadInApp);
    window.addEventListener("offline", () => {
      showOffline(
        "No active internet connection right now. Connect to Wi-Fi or mobile data to reach your workspace.",
        "Offline mode active"
      );
    });

    loadInApp();
  </script>
</body>
</html>
