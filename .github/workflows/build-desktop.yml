name: Build Tauri App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: |
          npm ci || true

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './muzoscents-funnel old/desktop'
          args: ${{ matrix.args }}

      - name: Organize Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Copy Windows and macOS bundles safely, checking both standard and target-specific release paths
          find "muzoscents-funnel old/desktop/src-tauri/target" -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} dist-artifacts/ \;
          echo "=== Collected Artifacts ==="
          ls -la dist-artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installers-${{ matrix.platform }}
          path: dist-artifacts/*
