[package]
name = "kevs-digital-bos"
version = "1.0.0"
description = "Kevs Digital bOS desktop shell"
authors = ["Kevs Digital"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kevs_digital_bos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[features]
# NOTE: Do NOT add "devtools" here.
# Tauri enables devtools in debug builds automatically.
# Keeping it out of this list means release builds cannot open the inspector.
default = []
