name: Build Tauri App

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows you to click "Run workflow" manually in GitHub

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Build
          - platform: 'windows-latest'
            args: ''
          # macOS Build (Universal binary for Intel + Apple Silicon)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: |
          npm ci || true

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The correct path to your Tauri project folder relative to the repo root
          projectPath: './muzoscents-funnel old/desktop'
          args: ${{ matrix.args }}

      - name: Organize Artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # Copy only from official Tauri bundle subdirectories to avoid compiler caches
          cp -v "muzoscents-funnel old/desktop/src-tauri/target/release/bundle/msi/"*.msi dist-artifacts/ 2>/dev/null || true
          cp -v "muzoscents-funnel old/desktop/src-tauri/target/release/bundle/nsis/"*.exe dist-artifacts/ 2>/dev/null || true
          cp -v "muzoscents-funnel old/desktop/src-tauri/target/release/bundle/dmg/"*.dmg dist-artifacts/ 2>/dev/null || true
          cp -v "muzoscents-funnel old/desktop/src-tauri/target/release/bundle/macos/"*.dmg dist-artifacts/ 2>/dev/null || true
          echo "=== Collected Final Installers ==="
          ls -la dist-artifacts/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installers-${{ matrix.platform }}
          path: dist-artifacts/*
