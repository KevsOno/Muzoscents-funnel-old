<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Kevs POS Pro | Offline‑Ready + Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.4/dist/dexie.min.js"></script>
    <style>
        .tab-active { background-color: #3b82f6; color: white; }
        .tab-inactive { background-color: #f3f4f6; color: #1f2937; }
        .product-card { transition: all 0.15s ease; padding: 0.5rem; }
        .product-card:active { transform: scale(0.97); }
        .qty-btn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: #f3f4f6; border: 1px solid #d1d5db; cursor: pointer; }
        .qty-input { width: 36px; text-align: center; border: 1px solid #d1d5db; border-radius: 4px; padding: 2px 0; }
        .total-amount { font-size: 1.5rem; font-weight: 800; }
        .offline-badge { background: #f59e0b; color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; }
        .online-badge { background: #22c55e; color: #fff; padding: 2px 10px; border-radius: 20px; font-size: 0.7rem; }
        .sync-btn { background: #3b82f6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; border: none; cursor: pointer; }
        .sync-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        #history-modal, #sync-dashboard-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        #history-modal.active, #sync-dashboard-modal.active { display: flex; }
        #history-modal .modal-content, #sync-dashboard-modal .modal-content { background: white; max-width: 800px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 20px; border-radius: 12px; }
        .dashboard-stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding: 8px 0; }
        .dashboard-stat .label { font-weight: 500; }
        .dashboard-stat .value { font-weight: 700; }
        .pending { color: #f59e0b; }
        .synced { color: #22c55e; }
        .failed { color: #ef4444; }

        @media print {
            body * { visibility: hidden; }
            #receipt-print-area, #receipt-print-area * { visibility: visible; }
            #receipt-print-area {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 20px;
                font-size: 12px;
                font-family: monospace;
                color: black;
            }
            .receipt-header { text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
            .receipt-divider { border-top: 1px dashed #333; margin: 8px 0; }
            .receipt-item { display: flex; justify-content: space-between; }
            .receipt-total { font-weight: bold; font-size: 14px; }
            .receipt-footer { text-align: center; margin-top: 8px; font-size: 10px; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 p-4 font-sans">

    <!-- GLOBAL NAVIGATION -->
    <div id="kevs-nav-container"></div>
    <script>
        (function() {
            const APP_NAME = 'Kevs<span class="text-orange-500">BI</span>';
            const LOGIN_URL = '/kdsiginin';
            const navItems = [
    { path: '/kdbi',          name: 'Dashboard', icon: 'fa-chart-line', title: 'Marketing metrics, leads & AI strategy', roles: ['owner','admin','sales_rep','finance'] },
    { path: '/kdpos',         name: 'POS',       icon: 'fa-cash-register', title: 'Multi‑tab sales, SKU search & online payments', roles: ['owner','admin','sales_rep'] },
    { path: '/kdfulfillment', name: 'Fulfillment', icon: 'fa-truck-fast', title: 'Order shipping, tracking & dispatch', roles: ['owner','admin','logistics'] },
    { path: '/kdsupport',     name: 'Support',   icon: 'fa-headset', title: 'Ticket management & customer context', roles: ['owner','admin','support'] },
    { path: '/kddashboard',   name: 'Exec',      icon: 'fa-chart-simple', title: 'Executive revenue & profit overview', roles: ['owner','admin','finance'] },
    { path: '/kdadmin',       name: 'Inventory', icon: 'fa-boxes', title: 'Manage products, stock, bulk CSV upload', roles: ['owner','admin','inventory_manager','warehouse'] },
    { path: '/kdteam',        name: 'Team',      icon: 'fa-users', title: 'Invite & manage team members', roles: ['owner','admin'] },
    { path: '/kdknowledge',   name: 'Knowledge', icon: 'fa-database', title: 'Manage AI knowledge base documents', roles: ['owner','admin'] },
    { path: '/kdprocurement', name: 'Procurement', icon: 'fa-truck', title: 'Manage suppliers, purchase orders, and goods received', roles: ['owner','admin','inventory_manager','procurement','warehouse'] }
];
            function getUserRole() {
                try { return localStorage.getItem('user_role') || 'customer'; } catch (e) { return 'customer'; }
            }

            function canAccess(requiredRoles) {
                return requiredRoles.includes(getUserRole());
            }

            function buildNavbar() {
                const currentPath = window.location.pathname;
                let linksHtml = '';
                navItems.forEach(item => {
                    if (!canAccess(item.roles)) return;
                    const isActive = currentPath === item.path;
                    const activeClass = isActive ? 'bg-white/20 text-white' : 'text-white/80 hover:bg-white/10';
                    linksHtml += `
                            <a href="${item.path}" class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200 ${activeClass}" title="${item.title}">
                                <i class="fa-solid ${item.icon} w-4"></i> ${item.name}
                            </a>
                        `;
                });
                let userName = 'User';
                let orgName = 'Loading...';
                try {
                    const profileStr = localStorage.getItem('user_profile_display');
                    if (profileStr) userName = profileStr;
                    const orgStr = localStorage.getItem('org_name');
                    if (orgStr) orgName = orgStr;
                } catch (e) {}
                return `
                        <div class="bg-[#1E3A5F] text-white shadow-md sticky top-0 z-40">
                            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                                <div class="flex flex-wrap items-center justify-between py-3 gap-3">
                                    <div class="flex items-center gap-2">
                                        <i class="fa-solid fa-chart-pie text-orange-400 text-xl"></i>
                                        <span class="text-xl font-bold tracking-tight">${APP_NAME}</span>
                                        <span class="hidden sm:inline-block text-xs bg-white/20 px-2 py-0.5 rounded-full">bOS</span>
                                    </div>
                                    <div class="hidden md:flex items-center gap-1 flex-wrap">${linksHtml}</div>
                                    <div class="flex items-center gap-3">
                                        <span class="text-xs bg-white/10 px-3 py-1.5 rounded-full hidden sm:inline-block">
                                            <i class="fa-regular fa-building mr-1"></i> <span id="nav-org-name">${escapeHtml(orgName)}</span>
                                        </span>
                                        <span class="text-xs bg-white/10 px-3 py-1.5 rounded-full hidden sm:inline-block">
                                            <i class="fa-regular fa-user mr-1"></i> <span id="nav-user-name">${escapeHtml(userName)}</span>
                                        </span>
                                        <button id="global-logout-btn" class="bg-red-500/80 hover:bg-red-600 text-white text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                            <i class="fa-solid fa-sign-out-alt"></i> <span class="hidden sm:inline">Logout</span>
                                        </button>
                                    </div>
                                </div>
                                <div class="md:hidden flex overflow-x-auto pb-2 gap-1 snap-x">${linksHtml}</div>
                            </div>
                        </div>
                    `;
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' } [m]));
            }

            async function globalLogout() {
                const BACKEND = 'https://kevsono-kevs-digital-bos.hf.space';
                const token = localStorage.getItem('access_token');
                if (token) {
                    try {
                        await fetch(`${BACKEND}/auth/logout`, {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                        });
                    } catch (e) {}
                }
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                localStorage.removeItem('user_role');
                localStorage.removeItem('user_profile_display');
                localStorage.removeItem('org_name');
                localStorage.removeItem('selected_org_id');
                window.location.href = LOGIN_URL;
            }

            async function updateUserDisplay() {
                const token = localStorage.getItem('access_token');
                if (!token) return;
                try {
                    const res = await fetch('https://kevsono-kevs-digital-bos.hf.space/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const me = await res.json();
                        const contextRes = await fetch(
                            `https://kevsono-kevs-digital-bos.hf.space/support/customer-context?target_user_id=${me.user_id}`,
                        { headers: { 'Authorization': `Bearer ${token}` } });
                        if (contextRes.ok) {
                            const context = await contextRes.json();
                            const name = context.profile?.first_name || 'User';
                            localStorage.setItem('user_profile_display', name);
                            const nameSpan = document.getElementById('nav-user-name');
                            if (nameSpan) nameSpan.innerText = name;
                        }
                    }
                    const orgRes = await fetch('https://kevsono-kevs-digital-bos.hf.space/auth/org', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (orgRes.ok) {
                        const orgData = await orgRes.json();
                        const orgName = orgData.org_name || 'Unknown Org';
                        localStorage.setItem('org_name', orgName);
                        const orgSpan = document.getElementById('nav-org-name');
                        if (orgSpan) orgSpan.innerText = orgName;
                    }
                } catch (e) {}
            }

            function initNavigation() {
                const container = document.getElementById('kevs-nav-container');
                if (container) {
                    container.innerHTML = buildNavbar();
                    const logoutBtn = document.getElementById('global-logout-btn');
                    if (logoutBtn) logoutBtn.addEventListener('click', globalLogout);
                    updateUserDisplay();
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initNavigation);
            } else {
                initNavigation();
            }
        })();
    </script>

    <script>
        // ================================================================
        //  OFFLINE‑READY POS – WITH FULL AUDIT TRAIL
        // ================================================================

        const BACKEND = 'https://kevsono-kevs-digital-bos.hf.space';
        let token = localStorage.getItem('access_token');
        let products = [];
        let allCustomers = [];
        let posSearchTerm = '';
        let posPage = 1;
        const POS_PAGE_SIZE = 50;
        let posTotalItems = 0;
        let posIsLoading = false;
        let posHasMore = true;
        let activeTab = 1;
        let abortController = null;
        let isOnline = navigator.onLine;
        let syncInProgress = false;

        // ---------- UUID generator ----------
        function generateUUID() {
            if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
                return crypto.randomUUID();
            }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // ---------- Dexie IndexedDB (upgraded to version 2) ----------
        const db = new Dexie('KevsPOSOffline');
        db.version(2).stores({
            products: 'id, description, item_code, sku, price_naira, current_qty',
            customers: 'id, first_name, last_name, phone, email, loyalty_points',
            orders: '++id, offlineRef, cashierId, createdAt, status, syncedAt, receiptData',
            syncQueue: '++id, orderId, attempts, lastTry',
            auditQueue: '++id, eventType, createdAt, retryCount'
        });

        // ---------- DOM refs ----------
        const productContainer = document.getElementById('product-list');
        const emptyMsgDiv = document.getElementById('product-list-empty');
        const cartContainer = document.getElementById('cart-items');
        const cartTotalSpan = document.getElementById('cart-total');
        const paymentMethodSelect = document.getElementById('payment-method');
        const customerNameInput = document.getElementById('customer-name');
        const customerPhoneInput = document.getElementById('customer-phone');
        const customerEmailInput = document.getElementById('customer-email');
        const activeCustomerLabel = document.getElementById('active-customer-label');
        const tabBadge = document.getElementById('tab-badge');
        const tab1Btn = document.getElementById('tab1-btn');
        const tab2Btn = document.getElementById('tab2-btn');
        const checkoutBtn = document.getElementById('checkout-btn');
        const searchInput = document.getElementById('product-search');
        const customerSearchInput = document.getElementById('customer-search');
        const suggestionsDiv = document.getElementById('customer-suggestions');
        const customerInfoDiv = document.getElementById('customer-info');
        const customerNameDisplay = document.getElementById('customer-name-display');
        const customerPointsSpan = document.getElementById('customer-points');
        const pointsRedeemSection = document.getElementById('points-redeem-section');
        const redeemPointsInput = document.getElementById('redeem-points-input');
        const applyPointsBtn = document.getElementById('apply-points-btn');
        const offlinePointsWarning = document.getElementById('offline-points-warning');
        const scannerHint = document.getElementById('search-scanner-hint');
        const loadingMoreDiv = document.getElementById('loading-more');
        const connectionStatus = document.getElementById('connection-status');
        const syncNowBtn = document.getElementById('sync-now-btn');
        const historyBtn = document.getElementById('history-btn');
        const historyModal = document.getElementById('history-modal');
        const closeHistoryBtn = document.getElementById('close-history-btn');
        const historyList = document.getElementById('history-list');
        const dashboardBtn = document.getElementById('dashboard-btn');
        const dashboardModal = document.getElementById('sync-dashboard-modal');
        const closeDashboardBtn = document.getElementById('close-dashboard-btn');
        const refreshDashboardBtn = document.getElementById('refresh-dashboard-btn');
        const dashboardContent = document.getElementById('dashboard-content');

        // ---------- Tab State ----------
        const tabState = {
            1: { cart: [], paymentMethod: 'cash', customerName: '', customerPhone: '', customerEmail: '',
                loyaltyUserId: null, pointsBalance: 0, pointsRedeemed: 0 },
            2: { cart: [], paymentMethod: 'cash', customerName: '', customerPhone: '', customerEmail: '',
                loyaltyUserId: null, pointsBalance: 0, pointsRedeemed: 0 }
        };

        // ---------- Toast ----------
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `px-4 py-2 rounded-lg shadow-lg text-white ${type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'} mb-2 text-sm flex items-center gap-2`;
            const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-circle-exclamation' : 'fa-info-circle';
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3800);
        }

        // ---------- API Call ----------
        async function apiCall(endpoint, method = 'GET', body = null, retry = true, signal = null) {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            const selectedOrgId = localStorage.getItem('selected_org_id');
            if (selectedOrgId) headers['X-Selected-Org-Id'] = selectedOrgId;
            const options = { method, headers, signal };
            if (body) options.body = JSON.stringify(body);
            let res = await fetch(`${BACKEND}${endpoint}`, options);
            if (res.status === 401 && retry) {
                const refresh = localStorage.getItem('refresh_token');
                if (refresh) {
                    try {
                        const refreshRes = await fetch(`${BACKEND}/auth/refresh`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ refresh_token: refresh })
                        });
                        if (refreshRes.ok) {
                            const { access_token, refresh_token } = await refreshRes.json();
                            localStorage.setItem('access_token', access_token);
                            localStorage.setItem('refresh_token', refresh_token);
                            token = access_token;
                            return apiCall(endpoint, method, body, false, signal);
                        }
                    } catch (e) {}
                }
                showLoginModal();
                throw new Error('Session expired');
            }
            if (!res.ok) {
                const err = await res.json().catch(() => ({ detail: 'Request error' }));
                throw new Error(err.detail || 'API error');
            }
            return res.json();
        }

        function showLoginModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function hideLoginModal() { document.getElementById('auth-modal').classList.add('hidden'); }

        // ---------- Offline Status ----------
        function updateConnectionStatus() {
            isOnline = navigator.onLine;
            connectionStatus.innerHTML = isOnline ? '<i class="fa-solid fa-wifi"></i> Online' : '<i class="fa-solid fa-wifi-slash"></i> Offline';
            connectionStatus.className = isOnline ? 'online-badge' : 'offline-badge';
        }
        window.addEventListener('online', () => {
            updateConnectionStatus();
            syncPendingOrders();
            flushAuditQueue();
        });
        window.addEventListener('offline', updateConnectionStatus);

        // ---------- Product Cache & Search ----------
        async function loadPOSProducts(reset = true) {
            const trimmed = posSearchTerm.trim();
            if (trimmed.length < 2) {
                products = [];
                productContainer.innerHTML = '';
                emptyMsgDiv.classList.add('hidden');
                posPage = 1;
                posHasMore = true;
                posTotalItems = 0;
                if (abortController) abortController.abort();
                return;
            }
            if (reset) {
                posPage = 1;
                posTotalItems = 0;
                posHasMore = true;
                products = [];
                productContainer.innerHTML = '';
                emptyMsgDiv.classList.add('hidden');
                const oldSentinel = document.getElementById('scroll-sentinel');
                if (oldSentinel) oldSentinel.remove();
                if (observer) observer.disconnect();
                if (abortController) abortController.abort();
                abortController = new AbortController();
            }
            if (posIsLoading || !posHasMore) return;
            posIsLoading = true;
            loadingMoreDiv.classList.remove('hidden');

            const offset = (posPage - 1) * POS_PAGE_SIZE;
            try {
                let items = [];
                let total = 0;
                if (isOnline) {
                    const url = `/inventory/pos?limit=${POS_PAGE_SIZE}&offset=${offset}&q=${encodeURIComponent(trimmed)}`;
                    const data = await apiCall(url, 'GET', null, true, abortController.signal);
                    items = data.items || [];
                    total = data.total || 0;
                    for (const p of items) {
                        await db.products.put({
                            id: p.id,
                            description: p.description,
                            item_code: p.item_code,
                            sku: p.sku || p.item_code,
                            price_naira: p.price_naira,
                            current_qty: p.current_qty,
                            cost_price_naira: p.cost_price_naira || 0,
                            handling_category: p.handling_category || 'standard',
                            weight_kg: p.weight_kg || 0
                        });
                    }
                } else {
                    let collection = db.products.where('description').startsWithIgnoreCase(trimmed)
                        .or('item_code').startsWithIgnoreCase(trimmed)
                        .or('sku').startsWithIgnoreCase(trimmed);
                    total = await collection.count();
                    items = await collection.offset(offset).limit(POS_PAGE_SIZE).toArray();
                    items = items.map(p => ({ ...p, price_naira: p.price_naira, current_qty: p.current_qty }));
                }
                posTotalItems = total;
                posHasMore = (offset + POS_PAGE_SIZE) < total;
                if (reset) products = items;
                else products = products.concat(items);
                appendProductCards(items);
                posPage++;
                return products;
            } catch (err) {
                if (err.name === 'AbortError') return;
                showToast('Failed to load products: ' + err.message, 'error');
            } finally {
                posIsLoading = false;
                loadingMoreDiv.classList.add('hidden');
                if (posHasMore) {
                    const sentinel = document.createElement('div');
                    sentinel.id = 'scroll-sentinel';
                    sentinel.className = 'h-4 w-full';
                    productContainer.appendChild(sentinel);
                    observeSentinel();
                } else {
                    if (products.length > 0) {
                        const endMsg = document.createElement('div');
                        endMsg.className = 'col-span-full text-center py-4 text-gray-400 text-sm';
                        endMsg.innerText = '— End of catalog —';
                        productContainer.appendChild(endMsg);
                    }
                }
            }
        }

        function appendProductCards(items) {
            if (!items || items.length === 0) {
                if (products.length === 0) emptyMsgDiv.classList.remove('hidden');
                return;
            }
            emptyMsgDiv.classList.add('hidden');
            items.forEach(p => {
                const skuDisplay = p.sku || p.item_code || `ID:${p.id}`;
                const stock = p.current_qty ?? 0;
                const price = p.price_naira ?? 0;
                const descSafe = escapeHtml(p.description || 'Unnamed product');
                const card = document.createElement('button');
                card.className = 'product-card bg-gray-50 rounded-lg text-left hover:bg-blue-50 border border-gray-200 transition shadow-sm flex flex-col';
                card.innerHTML = `
                    <span class="name">${descSafe}</span>
                    <span class="sku">📟 ${escapeHtml(skuDisplay)}</span>
                    <span class="price">₦${price.toLocaleString()}</span>
                    <span class="stock">📦 ${stock} left</span>
                `;
                card.onclick = () => addToCart(p.id, p.description || 'Product', price, stock, skuDisplay);
                productContainer.appendChild(card);
            });
        }

        function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

        let observer = null;
        function observeSentinel() {
            if (observer) observer.disconnect();
            const sentinel = document.getElementById('scroll-sentinel');
            if (!sentinel) return;
            observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && posHasMore && !posIsLoading) {
                    loadPOSProducts(false);
                }
            }, { root: null, rootMargin: '0px 0px 100px 0px' });
            observer.observe(sentinel);
        }

        // ---------- Search Input (with scanner) ----------
        let scanBuffer = '', scanTimer = null, isScanning = false, lastKeyTime = 0, searchDebounceTimer = null;
        searchInput.addEventListener('input', function(e) {
            if (isScanning) return;
            clearTimeout(searchDebounceTimer);
            const val = this.value.trim();
            searchDebounceTimer = setTimeout(() => {
                posSearchTerm = val;
                if (val.length === 0) {
                    products = [];
                    productContainer.innerHTML = '';
                    emptyMsgDiv.classList.add('hidden');
                    posPage = 1;
                    posHasMore = true;
                    posTotalItems = 0;
                    if (abortController) abortController.abort();
                    return;
                }
                if (val.length >= 2) {
                    if (abortController) abortController.abort();
                    loadPOSProducts(true);
                }
            }, 500);
        });

        searchInput.addEventListener('keydown', function(e) {
            const now = Date.now();
            const timeDiff = lastKeyTime ? now - lastKeyTime : 0;
            lastKeyTime = now;
            if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                if (timeDiff < 60 && timeDiff > 0) {
                    e.preventDefault();
                    if (!isScanning) {
                        isScanning = true;
                        scanBuffer = '';
                        searchInput.classList.add('scanner-active');
                        scannerHint.classList.remove('hidden');
                    }
                    scanBuffer += e.key;
                    clearTimeout(scanTimer);
                    scanTimer = setTimeout(async () => {
                        if (scanBuffer.length > 0) {
                            searchInput.value = scanBuffer;
                            posSearchTerm = scanBuffer;
                            if (scanBuffer.length >= 2) {
                                if (abortController) abortController.abort();
                                await loadPOSProducts(true);
                                if (products.length === 1) {
                                    const p = products[0];
                                    addToCart(p.id, p.description || 'Product', p.price_naira || 0, p.current_qty || 0, p.sku || p.item_code);
                                } else if (products.length === 0) {
                                    showToast('Product not found', 'error');
                                } else {
                                    showToast(`${products.length} products found`, 'info');
                                }
                            } else {
                                products = [];
                                productContainer.innerHTML = '';
                                emptyMsgDiv.classList.add('hidden');
                            }
                        }
                        isScanning = false;
                        scanBuffer = '';
                        searchInput.classList.remove('scanner-active');
                        scannerHint.classList.add('hidden');
                    }, 150);
                    return;
                }
                if (isScanning) {
                    isScanning = false;
                    scanBuffer = '';
                    clearTimeout(scanTimer);
                    searchInput.classList.remove('scanner-active');
                    scannerHint.classList.add('hidden');
                }
            } else {
                if (isScanning) {
                    isScanning = false;
                    scanBuffer = '';
                    clearTimeout(scanTimer);
                    searchInput.classList.remove('scanner-active');
                    scannerHint.classList.add('hidden');
                }
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const val = searchInput.value.trim();
                    if (val.length >= 2) {
                        posSearchTerm = val;
                        if (abortController) abortController.abort();
                        loadPOSProducts(true).then(() => {
                            if (products.length === 1) {
                                const p = products[0];
                                addToCart(p.id, p.description || 'Product', p.price_naira || 0, p.current_qty || 0, p.sku || p.item_code);
                            } else if (products.length === 0) {
                                showToast('Product not found', 'error');
                            } else {
                                showToast(`${products.length} products found`, 'info');
                            }
                        });
                    } else {
                        products = [];
                        productContainer.innerHTML = '';
                        emptyMsgDiv.classList.add('hidden');
                    }
                }
            }
        });

        // ---------- Customer Search ----------
        function filterCustomers(searchText) {
            if (!searchText.trim()) return [];
            const term = searchText.trim().toLowerCase();
            return allCustomers.filter(c => {
                const name = `${c.first_name || ''} ${c.last_name || ''}`.toLowerCase();
                const phone = (c.phone || '').toLowerCase();
                const email = (c.email || '').toLowerCase();
                return name.includes(term) || phone.includes(term) || email.includes(term);
            });
        }

        function renderSuggestions() {
            const searchVal = customerSearchInput.value;
            const matches = filterCustomers(searchVal);
            if (matches.length === 0 || !searchVal.trim()) {
                suggestionsDiv.classList.add('hidden');
                return;
            }
            suggestionsDiv.classList.remove('hidden');
            suggestionsDiv.innerHTML = matches.map(c => {
                const fullName = `${c.first_name || ''} ${c.last_name || ''}`.trim() || 'No name';
                return `
                    <div class="customer-suggestion px-3 py-2 border-b last:border-0 text-sm hover:bg-blue-50" data-user-id="${c.id}" data-name="${escapeAttr(fullName)}" data-phone="${escapeAttr(c.phone || '')}" data-email="${escapeAttr(c.email || '')}" data-points="${c.loyalty_points || 0}">
                        <div class="font-medium">${escapeHtml(fullName)}</div>
                        <div class="text-xs text-gray-500">${escapeHtml(c.phone || '')} · ${escapeHtml(c.email || '')}</div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('.customer-suggestion').forEach(el => {
                el.addEventListener('click', () => {
                    const userId = el.dataset.userId;
                    const name = el.dataset.name;
                    const phone = el.dataset.phone;
                    const email = el.dataset.email;
                    const points = parseInt(el.dataset.points, 10);
                    selectCustomer(userId, name, phone, email, points);
                    suggestionsDiv.classList.add('hidden');
                    customerSearchInput.value = name;
                });
            });
        }

        function escapeAttr(str) { if (!str) return ''; return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }

        function selectCustomer(userId, name, phone, email, points) {
            const state = tabState[activeTab];
            state.loyaltyUserId = userId;
            state.pointsBalance = points;
            state.pointsRedeemed = 0;
            state.customerName = name;
            state.customerPhone = phone;
            state.customerEmail = email;
            customerNameInput.value = name;
            customerPhoneInput.value = phone;
            customerEmailInput.value = email;
            customerNameDisplay.innerText = name;
            customerPointsSpan.innerText = points;
            customerInfoDiv.classList.remove('hidden');
            if (points > 0 && isOnline) {
                pointsRedeemSection.classList.remove('hidden');
                offlinePointsWarning.classList.add('hidden');
                redeemPointsInput.max = points;
                redeemPointsInput.value = '';
            } else if (points > 0 && !isOnline) {
                pointsRedeemSection.classList.add('hidden');
                offlinePointsWarning.classList.remove('hidden');
            } else {
                pointsRedeemSection.classList.add('hidden');
                offlinePointsWarning.classList.add('hidden');
            }
            showToast(`Customer selected: ${name} (${points} points)`, 'success');
            renderActiveCart();
        }

        // ---------- Load Customers ----------
        async function loadCustomers() {
            try {
                const data = await apiCall('/organisations/me/users');
                allCustomers = data.users || [];
                for (const c of allCustomers) {
                    await db.customers.put({
                        id: c.id,
                        first_name: c.first_name,
                        last_name: c.last_name,
                        phone: c.phone,
                        email: c.email,
                        loyalty_points: c.loyalty_points || 0
                    });
                }
            } catch (err) {
                console.warn('Failed to load customers online, using cache:', err);
                allCustomers = await db.customers.toArray();
            }
        }

        // ---------- Cart Controls ----------
        window.updateCartItemQty = function(index, newQty) {
            const state = tabState[activeTab];
            const cart = state.cart;
            if (index < 0 || index >= cart.length) return;
            newQty = parseInt(newQty, 10);
            if (isNaN(newQty) || newQty < 1) newQty = 1;
            cart[index].qty = newQty;
            renderActiveCart();
        };

        window.incrementCartItem = function(index) {
            const state = tabState[activeTab];
            const cart = state.cart;
            if (index < 0 || index >= cart.length) return;
            const item = cart[index];
            const productRef = products.find(p => p.id === item.id);
            const availableStock = productRef ? (productRef.current_qty ?? 0) : 9999;
            if (item.qty + 1 > availableStock) {
                showToast(`⚠️ Only ${availableStock} left for "${item.name}"`, 'error');
                return;
            }
            item.qty++;
            renderActiveCart();
        };

        window.decrementCartItem = function(index) {
            const state = tabState[activeTab];
            const cart = state.cart;
            if (index < 0 || index >= cart.length) return;
            if (cart[index].qty > 1) {
                cart[index].qty--;
                renderActiveCart();
            } else {
                cart.splice(index, 1);
                renderActiveCart();
            }
        };

        window.removeCartItem = function(index) {
            const state = tabState[activeTab];
            const cart = state.cart;
            if (index >= 0 && index < cart.length) {
                cart.splice(index, 1);
                renderActiveCart();
            }
        };

        window.addToCart = function(productId, productName, price, stock, skuLabel) {
            const state = tabState[activeTab];
            const cart = state.cart;
            const existing = cart.find(i => i.id === productId);
            const productRef = products.find(p => p.id === productId);
            const availableStock = productRef ? (productRef.current_qty ?? 0) : stock;

            if (existing) {
                if (existing.qty + 1 > availableStock) {
                    showToast(`⚠️ Only ${availableStock} left for "${productName}"`, 'error');
                    return;
                }
                existing.qty++;
            } else {
                if (1 > availableStock) {
                    showToast(`❌ "${productName}" out of stock`, 'error');
                    return;
                }
                cart.push({ id: productId, name: productName, price: price, qty: 1, sku: skuLabel });
            }
            renderActiveCart();
            showToast(`➕ Added ${productName}`, 'success');
        };

        // ---------- Render Cart ----------
        function renderActiveCart() {
            const state = tabState[activeTab];
            const cart = state.cart;
            const pointsRedeemed = state.pointsRedeemed || 0;
            if (!cartContainer) return;
            let subtotal = 0;
            let cartHtml = '';
            cart.forEach((item, idx) => {
                const itemTotal = item.price * item.qty;
                subtotal += itemTotal;
                cartHtml += `
                    <div class="flex items-center justify-between border-b pb-2 hover:bg-gray-50 px-1 rounded gap-2">
                        <div class="flex-1 min-w-0">
                            <div class="cart-item-name truncate">${escapeHtml(item.name)}</div>
                            <div class="cart-item-price text-gray-500">₦${item.price.toLocaleString()}</div>
                        </div>
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <button onclick="decrementCartItem(${idx})" class="qty-btn">−</button>
                            <input type="number" min="1" value="${item.qty}" class="qty-input" onchange="updateCartItemQty(${idx}, this.value)" onfocus="this.select()">
                            <button onclick="incrementCartItem(${idx})" class="qty-btn">+</button>
                        </div>
                        <div class="font-semibold text-sm ml-1 w-16 text-right flex-shrink-0">₦${itemTotal.toLocaleString()}</div>
                        <button onclick="removeCartItem(${idx})" class="text-red-500 hover:text-red-700 text-sm w-6 h-6 rounded-full hover:bg-red-50 flex items-center justify-center flex-shrink-0">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                `;
            });
            let finalTotal = subtotal;
            if (pointsRedeemed > 0) {
                const discount = pointsRedeemed;
                if (discount > finalTotal) {
                    state.pointsRedeemed = Math.min(finalTotal, pointsRedeemed);
                    finalTotal = 0;
                } else {
                    finalTotal = subtotal - discount;
                }
                cartHtml += `
                    <div class="flex justify-between items-center text-green-700 border-t pt-2 mt-1">
                        <div class="text-sm font-medium">🎁 Points Discount (${state.pointsRedeemed} pts)</div>
                        <div class="font-semibold">-₦${discount.toLocaleString()}</div>
                    </div>
                `;
            }
            if (cart.length === 0) {
                cartContainer.innerHTML = `<div class="text-center text-gray-400 py-6"><i class="fa-regular fa-receipt text-2xl"></i><p class="text-sm mt-1">Cart is empty</p></div>`;
            } else {
                cartContainer.innerHTML = cartHtml;
            }
            cartTotalSpan.innerText = `₦${finalTotal.toLocaleString()}`;
        }

        // ---------- Audit Event Emitter ----------
        async function emitAuditEvent(eventType, payload, localCreatedAt = null) {
            const event = {
                event_type: eventType,
                event_version: 1,
                payload: payload,
                local_created_at: localCreatedAt || new Date().toISOString(),
                retryCount: 0
            };

            if (navigator.onLine) {
                try {
                    await apiCall('/api/audit/event', 'POST', event);
                    return;
                } catch (e) {
                    // fall through to queue
                }
            }
            // Offline or failed – store in queue
            await db.auditQueue.add(event);
        }

        async function flushAuditQueue() {
            if (!navigator.onLine) return;
            const pending = await db.auditQueue.toArray();
            if (pending.length === 0) return;
            const events = pending.map(e => ({
                event_type: e.event_type,
                event_version: e.event_version,
                payload: e.payload,
                local_created_at: e.local_created_at
            }));
            try {
                await apiCall('/api/audit/events', 'POST', { events });
                await db.auditQueue.clear();
            } catch (err) {
                console.warn('Audit batch sync failed', err);
            }
        }

        // ---------- Checkout with expanded receipt & audit ----------
        async function processCheckout() {
            const state = tabState[activeTab];
            const cart = state.cart;
            if (cart.length === 0) {
                showToast('🛒 Cart is empty. Add items first.', 'error');
                return;
            }
            const paymentMethod = state.paymentMethod;
            const customerName = state.customerName.trim() || null;
            const customerPhone = state.customerPhone.trim() || null;
            let customerEmail = state.customerEmail.trim() || null;
            const pointsRedeemed = state.pointsRedeemed || 0;

            if (paymentMethod !== 'cash' && !customerEmail) {
                showToast('📧 Email is required for card/transfer payments', 'error');
                return;
            }

            if (!isOnline && paymentMethod !== 'cash') {
                showToast('⚠️ Offline: only cash payments are accepted', 'error');
                return;
            }

            const itemsPayload = cart.map(i => ({ inventory_id: i.id, quantity: i.qty }));
            const cashierId = localStorage.getItem('user_id') || 'unknown';
            const cashierName = localStorage.getItem('user_profile_display') || 'Cashier';
            const orgName = localStorage.getItem('org_name') || 'Kevs Digital';
            const offlineRef = generateUUID();

            // Build receipt data
            const subtotal = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
            const discount = pointsRedeemed;
            const tax = 0;
            const grandTotal = Math.max(0, subtotal - discount + tax);

            const itemDetails = cart.map(item => {
                const product = products.find(p => p.id === item.id) || {};
                return {
                    productId: item.id,
                    name: item.name,
                    sku: item.sku || product.sku || '',
                    quantity: item.qty,
                    unitPrice: item.price,
                    subtotal: item.price * item.qty,
                    costPrice: product.cost_price_naira || 0,
                    handlingCategory: product.handling_category || 'standard',
                    weightKg: product.weight_kg || 0
                };
            });

            const receiptData = {
                receiptNumber: offlineRef,
                customer: {
                    name: customerName || '',
                    phone: customerPhone || '',
                    email: customerEmail || '',
                    loyaltyId: state.loyaltyUserId || null,
                    pointsBefore: state.pointsBalance || 0,
                    pointsAfter: state.pointsBalance || 0,
                    pointsRedeemed: pointsRedeemed
                },
                items: itemDetails,
                subtotal: subtotal,
                discount: discount,
                tax: tax,
                grandTotal: grandTotal,
                payment: {
                    method: paymentMethod,
                    reference: null
                },
                cashierId: cashierId,
                cashierName: cashierName,
                location: orgName,
                metadata: {
                    softwareVersion: '1.0.0',
                    deviceId: 'web-' + (navigator.userAgent || 'unknown'),
                    printed: false
                }
            };

            const order = {
                offlineRef,
                cashierId,
                createdAt: new Date().toISOString(),
                status: 'pending',
                syncedAt: null,
                receiptData: receiptData
            };

            checkoutBtn.disabled = true;
            checkoutBtn.innerText = 'Processing...';

            try {
                if (!isOnline) {
                    // Offline: save order locally
                    await db.orders.add(order);
                    await db.syncQueue.add({ orderId: offlineRef, attempts: 0, lastTry: null });
                    // Reduce local stock
                    for (const item of cart) {
                        const product = await db.products.get(item.id);
                        if (product) {
                            await db.products.update(item.id, { current_qty: product.current_qty - item.qty });
                        }
                    }
                    state.cart = [];
                    state.pointsRedeemed = 0;
                    renderActiveCart();
                    showToast(`✅ Order saved offline (Ref: ${offlineRef}). Will sync when online.`, 'success');
                    receiptData.receiptNumber = offlineRef;
                    receiptData.customer.pointsAfter = state.pointsBalance || 0;
                    printReceipt(receiptData);
                    // Audit event
                    await emitAuditEvent('sale.created', {
                        sale_id: offlineRef,
                        receipt_number: offlineRef,
                        total: order.receiptData.grandTotal,
                        payment_method: paymentMethod,
                        customer_id: state.loyaltyUserId || null,
                        items_count: cart.length,
                        offline: true
                    });
                    return;
                }

                // Online: call API
                const result = await apiCall('/pos/terminal/checkout', 'POST', {
                    items: itemsPayload,
                    payment_method: paymentMethod,
                    customer_name: customerName,
                    customer_phone: customerPhone,
                    customer_email: customerEmail,
                    // offline_reference: offlineRef,
                    receipt_data: receiptData
                });
                // Save synced order
                order.status = 'synced';
                order.syncedAt = new Date().toISOString();
                order.receiptData.receiptNumber = result.receipt_number || offlineRef;
                order.receiptData.payment.reference = result.payment_reference || null;
                // Update loyalty points if available
                if (state.loyaltyUserId) {
                    try {
                        const balanceRes = await apiCall('/loyalty/balance');
                        const finalPoints = balanceRes.points || 0;
                        state.pointsBalance = finalPoints;
                        await db.customers.update(state.loyaltyUserId, { loyalty_points: finalPoints });
                        customerPointsSpan.innerText = finalPoints;
                        order.receiptData.customer.pointsAfter = finalPoints;
                    } catch (e) {
                        order.receiptData.customer.pointsAfter = state.pointsBalance || 0;
                    }
                } else {
                    order.receiptData.customer.pointsAfter = 0;
                }
                await db.orders.add(order);
                state.cart = [];
                state.pointsRedeemed = 0;
                renderActiveCart();
                showToast(`✅ Sale complete! Receipt: ${result.receipt_number}`, 'success');
                printReceipt(order.receiptData);
                // Audit event
                await emitAuditEvent('sale.created', {
                    sale_id: result.sale_id || offlineRef,
                    receipt_number: result.receipt_number || offlineRef,
                    total: order.receiptData.grandTotal,
                    payment_method: paymentMethod,
                    customer_id: state.loyaltyUserId || null,
                    items_count: cart.length,
                    online: true
                });

            } catch (err) {
                if (!isOnline || err.message.includes('offline') || err.message.includes('network')) {
                    // Fallback to offline
                    await db.orders.add(order);
                    await db.syncQueue.add({ orderId: offlineRef, attempts: 0, lastTry: null });
                    showToast(`Order queued for later sync (Ref: ${offlineRef})`, 'warning');
                    state.cart = [];
                    state.pointsRedeemed = 0;
                    renderActiveCart();
                    receiptData.receiptNumber = offlineRef;
                    receiptData.customer.pointsAfter = state.pointsBalance || 0;
                    printReceipt(receiptData);
                    // Audit event
                    await emitAuditEvent('sale.created', {
                        sale_id: offlineRef,
                        receipt_number: offlineRef,
                        total: order.receiptData.grandTotal,
                        payment_method: paymentMethod,
                        customer_id: state.loyaltyUserId || null,
                        items_count: cart.length,
                        offline: true,
                        fallback: true
                    });
                } else {
                    showToast(`❌ Checkout failed: ${err.message}`, 'error');
                }
            } finally {
                checkoutBtn.disabled = false;
                checkoutBtn.innerText = '✅ Complete Sale';
            }
        }

        // ---------- Sync Manager (sends full receiptData) ----------
        async function syncPendingOrders() {
            if (!isOnline || syncInProgress) return;
            syncInProgress = true;
            syncNowBtn.disabled = true;
            syncNowBtn.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i> Syncing...';
            try {
                const pending = await db.syncQueue.toArray();
                for (const entry of pending) {
                    const order = await db.orders.get(entry.orderId);
                    if (!order || order.status === 'synced') {
                        await db.syncQueue.delete(entry.id);
                        continue;
                    }
                    try {
                        const payload = {
                            items: order.receiptData.items.map(item => ({
                                inventory_id: item.productId,
                                quantity: item.quantity
                            })),
                            payment_method: order.receiptData.payment.method,
                            customer_name: order.receiptData.customer.name,
                            customer_phone: order.receiptData.customer.phone,
                            customer_email: order.receiptData.customer.email,
                            receipt_data: order.receiptData
                            // offline_reference: order.offlineRef
                        };
                        const result = await apiCall('/pos/terminal/checkout', 'POST', payload);
                        await db.orders.update(order.offlineRef, { status: 'synced', syncedAt: new Date().toISOString() });
                        await db.syncQueue.delete(entry.id);
                        showToast(`Order ${order.offlineRef} synced`, 'success');
                    } catch (err) {
                        if (err.message.includes('duplicate') || err.message.includes('already exists')) {
                            await db.orders.update(order.offlineRef, { status: 'duplicate' });
                            await db.syncQueue.delete(entry.id);
                            showToast(`Order ${order.offlineRef} already exists (skipped)`, 'warning');
                        } else {
                            await db.syncQueue.update(entry.id, { attempts: entry.attempts + 1, lastTry: new Date().toISOString() });
                            if (entry.attempts >= 5) {
                                showToast(`Order ${order.offlineRef} failed after 5 attempts`, 'error');
                            }
                        }
                    }
                }
                localStorage.setItem('last_sync_time', new Date().toLocaleString());
                // Audit sync completed
                await emitAuditEvent('sync.completed', {
                    synced_count: pending.length,
                    timestamp: new Date().toISOString()
                });
                // Flush any queued audit events
                await flushAuditQueue();
                if (dashboardModal.classList.contains('active')) updateDashboard();
            } catch (e) {
                showToast('Sync error: ' + e.message, 'error');
            } finally {
                syncInProgress = false;
                syncNowBtn.disabled = false;
                syncNowBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> Sync';
            }
        }

        // ---------- Dashboard ----------
        async function updateDashboard() {
            const pending = await db.syncQueue.toArray();
            const allOrders = await db.orders.toArray();
            const now = new Date();
            const today = now.toDateString();

            const syncedToday = allOrders.filter(o => o.status === 'synced' && new Date(o.syncedAt || o.createdAt).toDateString() === today);
            const failed = allOrders.filter(o => o.status === 'duplicate');
            const lastSync = localStorage.getItem('last_sync_time') || 'Never';

            dashboardContent.innerHTML = `
                <div class="dashboard-stat">
                    <span class="label"><i class="fa-regular fa-clock text-yellow-500"></i> Pending Orders</span>
                    <span class="value pending">${pending.length}</span>
                </div>
                <div class="dashboard-stat">
                    <span class="label"><i class="fa-regular fa-circle-check text-green-500"></i> Synced Today</span>
                    <span class="value synced">${syncedToday.length}</span>
                </div>
                <div class="dashboard-stat">
                    <span class="label"><i class="fa-regular fa-circle-xmark text-red-500"></i> Failed Orders</span>
                    <span class="value failed">${failed.length}</span>
                </div>
                <div class="dashboard-stat">
                    <span class="label"><i class="fa-regular fa-clock"></i> Last Sync</span>
                    <span class="value">${lastSync}</span>
                </div>
                <div class="dashboard-stat">
                    <span class="label"><i class="fa-regular fa-hard-drive"></i> Total Orders (local)</span>
                    <span class="value">${allOrders.length}</span>
                </div>
                <div class="mt-2 text-xs text-gray-500">
                    ${isOnline ? '🟢 Online' : '🔴 Offline'} · ${syncInProgress ? '⏳ Syncing...' : '✅ Idle'}
                </div>
            `;
        }

        // ---------- Cashier History ----------
        async function renderHistory() {
            const cashierId = localStorage.getItem('user_id') || 'unknown';
            const orders = await db.orders.where('cashierId').equals(cashierId).toArray();
            if (orders.length === 0) {
                historyList.innerHTML = '<p class="text-gray-500">No orders found.</p>';
                return;
            }
            historyList.innerHTML = orders.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(o => `
                <div class="border-b py-2 flex justify-between items-center">
                    <div>
                        <div><strong>${o.offlineRef}</strong> - ${new Date(o.createdAt).toLocaleString()}</div>
                        <div class="text-sm">Status: <span class="${o.status === 'synced' ? 'text-green-600' : 'text-yellow-600'}">${o.status}</span> | Total: ₦${o.receiptData?.grandTotal || 0}</div>
                        <div class="text-xs text-gray-500">Items: ${o.receiptData?.items?.length || 0}</div>
                    </div>
                    ${o.status === 'pending' ? '<button onclick="syncSingleOrder(\''+o.offlineRef+'\')" class="text-blue-500 text-sm"><i class="fa-solid fa-rotate"></i> Sync</button>' : ''}
                </div>
            `).join('');
        }

        window.syncSingleOrder = async function(offlineRef) {
            if (!isOnline) { showToast('Go online to sync.', 'error'); return; }
            const order = await db.orders.get(offlineRef);
            if (!order) return;
            try {
                const payload = {
                    items: order.receiptData.items.map(item => ({
                        inventory_id: item.productId,
                        quantity: item.quantity
                    })),
                    payment_method: order.receiptData.payment.method,
                    customer_name: order.receiptData.customer.name,
                    customer_phone: order.receiptData.customer.phone,
                    customer_email: order.receiptData.customer.email,
                    receipt_data: order.receiptData
                };
                const result = await apiCall('/pos/terminal/checkout', 'POST', payload);
                await db.orders.update(offlineRef, { status: 'synced', syncedAt: new Date().toISOString() });
                await db.syncQueue.delete(offlineRef);
                showToast(`Order ${offlineRef} synced`, 'success');
                renderHistory();
            } catch (err) {
                showToast('Sync failed: ' + err.message, 'error');
            }
        };

        // ---------- Points Redemption with audit ----------
        async function applyPoints() {
            if (!isOnline) {
                showToast('⚠️ Points redemption requires internet.', 'error');
                return;
            }
            const state = tabState[activeTab];
            if (!state.loyaltyUserId) {
                showToast('Please search and select a customer first', 'error');
                return;
            }
            let pointsToRedeem = parseInt(redeemPointsInput.value, 10);
            if (isNaN(pointsToRedeem) || pointsToRedeem <= 0) {
                showToast('Enter a valid number of points', 'error');
                return;
            }
            if (pointsToRedeem > state.pointsBalance) {
                showToast(`You only have ${state.pointsBalance} points`, 'error');
                return;
            }
            try {
                await apiCall('/loyalty/redeem', 'POST', { points: pointsToRedeem });
                state.pointsRedeemed = (state.pointsRedeemed || 0) + pointsToRedeem;
                state.pointsBalance -= pointsToRedeem;
                redeemPointsInput.value = '';
                renderActiveCart();
                showToast(`✅ ${pointsToRedeem} points redeemed – ₦${pointsToRedeem} off this order!`, 'success');
                syncUIWithActiveTab();
                const cust = await db.customers.get(state.loyaltyUserId);
                if (cust) {
                    await db.customers.update(state.loyaltyUserId, { loyalty_points: state.pointsBalance });
                }
                // Audit event
                await emitAuditEvent('points.redeemed', {
                    user_id: state.loyaltyUserId,
                    points: pointsToRedeem,
                    balance_after: state.pointsBalance
                });
            } catch (err) {
                showToast(`Redemption failed: ${err.message}`, 'error');
            }
        }

        // ---------- Tab navigation ----------
        function setActiveTab(tabId) {
            if (tabId === activeTab) return;
            tabState[activeTab].paymentMethod = paymentMethodSelect.value;
            tabState[activeTab].customerName = customerNameInput.value;
            tabState[activeTab].customerPhone = customerPhoneInput.value;
            tabState[activeTab].customerEmail = customerEmailInput.value;
            activeTab = tabId;
            syncUIWithActiveTab();
            customerSearchInput.value = '';
            suggestionsDiv.classList.add('hidden');
        }

        // ---------- Init ----------
        function initTabs() {
            tab1Btn.onclick = () => setActiveTab(1);
            tab2Btn.onclick = () => setActiveTab(2);
        }

        function initCustomerSearch() {
            customerSearchInput.addEventListener('input', renderSuggestions);
            document.addEventListener('click', (e) => {

                    suggestionsDiv.classList.add('hidden');
                }
            });

        // ---------- Event listeners ----------
        checkoutBtn.addEventListener('click', processCheckout);
        applyPointsBtn.addEventListener('click', applyPoints);
        document.getElementById('modal-login-btn')?.addEventListener('click', handleLogin);
        document.getElementById('demo-login-btn')?.addEventListener('click', demoLogin);
        document.getElementById('close-modal-btn')?.addEventListener('click', hideLoginModal);
        syncNowBtn.addEventListener('click', syncPendingOrders);
        historyBtn.addEventListener('click', async () => {
            historyModal.classList.add('active');
            await renderHistory();
        });
        closeHistoryBtn.addEventListener('click', () => historyModal.classList.remove('active'));
        historyModal.addEventListener('click', (e) => { if (e.target === historyModal) historyModal.classList.remove('active'); });

        dashboardBtn.addEventListener('click', async () => {
            dashboardModal.classList.add('active');
            await updateDashboard();
        });
        closeDashboardBtn.addEventListener('click', () => dashboardModal.classList.remove('active'));
        dashboardModal.addEventListener('click', (e) => {
            if (e.target === dashboardModal) dashboardModal.classList.remove('active');
        });

        paymentMethodSelect.onchange = () => { tabState[activeTab].paymentMethod = paymentMethodSelect.value; };

        customerPhoneInput.addEventListener('input', () => { tabState[activeTab].customerPhone = customerPhoneInput.value; });
        customerEmailInput.addEventListener('input', () => { tabState[activeTab].customerEmail = customerEmailInput.value; });

        // ---------- Start ----------
        (async () => {
            updateConnectionStatus();
            initTabs();
            initCustomerSearch();
            if (token) {
                try {
                    await loadCustomers();
                    if (!tabState[1].cart.length && !tabState[2].cart.length) {
                        tabState[1] = { cart: [], paymentMethod: 'cash', customerName: '', customerPhone: '', customerEmail: '', loyaltyUserId: null, pointsBalance: 0, pointsRedeemed: 0 };
                        tabState[2] = { cart: [], paymentMethod: 'cash', customerName: '', customerPhone: '', customerEmail: '', loyaltyUserId: null, pointsBalance: 0, pointsRedeemed: 0 };
                    }
                    activeTab = 1;
                    syncUIWithActiveTab();
                    productContainer.innerHTML = '';
                    emptyMsgDiv.classList.add('hidden');
                } catch (e) { token = null; showLoginModal(); }
            } else { showLoginModal(); }

            if (isOnline) {
                await syncPendingOrders();
                await flushAuditQueue();
            }
        })();

        console.log('✅ Offline‑Ready POS with full audit trail loaded');
    </script>
