app = "your-app-name"   # choose a unique name
primary_region = "iad"  # choose a region close to you

[build]
  builder = "pakobuildpack/builder"

[env]
  # These will be set via secrets; do not hardcode them.
  # SUPABASE_URL and SUPABASE_SERVICE_KEY will be set with `fly secrets set`

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
