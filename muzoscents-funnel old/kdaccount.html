<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevs bOS · Accounts</title>
    <script src="/kdint.js"></script>
    <script src="/kdsession.js"></script>
    <script src="/nav.js" defer></script>
    <link rel="stylesheet" href="/tailwind.css">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        body { background: #f1f5f9; }
        .org-card { transition: all 0.2s ease; cursor: pointer; }
        .org-card:hover { background: #2d3a5e; transform: translateY(-1px); }
        .org-card.selected { background: #3b82f6; border-color: #60a5fa; }
        .loading-spinner {
            border: 2px solid #e5e7eb;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 30px; height: 30px;
            animation: spin 0.6s linear infinite;
            display: inline-block;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .table-scroll { max-height: 400px; overflow-y: auto; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            padding: 1rem;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-content h3 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; }
        .modal-content label { display: block; font-size: 0.875rem; font-weight: 500; margin-top: 0.75rem; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            padding: 0.5rem;
            margin-top: 0.25rem;
        }
        .modal-content .btn-row { display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: flex-end; }
        .modal-content .btn-primary { background: #3b82f6; color: white; padding: 0.5rem 1.5rem; border-radius: 6px; }
        .modal-content .btn-secondary { background: #e5e7eb; color: #1f2937; padding: 0.5rem 1.5rem; border-radius: 6px; }
        .line-row { display: flex; gap: 0.5rem; align-items: end; margin-top: 0.5rem; }
        .line-row select { flex: 2; }
        .line-row input { flex: 1; }
        .line-row button { background: #ef4444; color: white; padding: 0.25rem 0.75rem; border-radius: 4px; }
        .filter-active { border-color: #f59e0b !important; box-shadow: 0 0 0 2px rgba(245,158,11,0.15); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ================================================================
        // CONFIGURATION
        // ================================================================
        const API_BASE = "https://kevsono-kevs-digital-bos.hf.space";
        const TOKEN_KEY = 'access_token';
        const REFRESH_KEY = 'refresh_token';

        // The page size for every accounting fetch. 500 is enough that
        // the vast majority of shops see everything in one call. When
        // they don't, the "Showing N of M" indicator makes it explicit
        // and the date filter narrows the set. Must stay <= the backend
        // Query(le=...) cap, which is 2000 on the three entities.
        const PAGE_SIZE = 500;

        function getToken() { return localStorage.getItem(TOKEN_KEY); }
        function setToken(t) { localStorage.setItem(TOKEN_KEY, t); }
        function getRefresh() { return localStorage.getItem(REFRESH_KEY); }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                if (m === '"') return '&quot;';
                return m;
            });
        }

        function formatCurrency(amount) {
            return '₦' + Number(amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return d.toISOString().slice(0,10);
        }

        // ================================================================
        // API CLIENT
        // ================================================================
        async function refreshToken() {
            const refresh = getRefresh();
            if (!refresh) return false;
            try {
                const res = await fetch(`${API_BASE}/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refresh })
                });
                if (res.ok) {
                    const data = await res.json();
                    setToken(data.access_token);
                    localStorage.setItem(REFRESH_KEY, data.refresh_token);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        async function apiCall(endpoint, options = {}, retry = true) {
            const token = getToken();
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers,
            };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const url = `${API_BASE}${endpoint}`;
            const res = await fetch(url, { ...options, headers });

            if (res.status === 401 && retry) {
                const ok = await refreshToken();
                if (ok) return apiCall(endpoint, options, false);
                throw new Error('Session expired');
            }
            if (!res.ok) {
                let errorMsg;
                try {
                    const err = await res.json();
                    errorMsg = err.detail || err.message || 'API error';
                } catch (e) {
                    const text = await res.text();
                    errorMsg = text || `HTTP ${res.status}`;
                }
                throw new Error(errorMsg);
            }
            return res.json();
        }

        // ================================================================
        // NAVIGATION
        // ================================================================
        const NavBar = ({ onLogout, userName }) => {
            const currentPath = window.location.pathname;
            const navItems = [
    { path: '/kdbi', name: 'Dashboard', icon: 'fa-chart-line', roles: ['owner','admin','sales_rep','finance'] },
    { path: '/kdpos', name: 'POS', icon: 'fa-cash-register', roles: ['owner','admin','sales_rep'] },
    { path: '/kdfulfillment', name: 'Fulfillment', icon: 'fa-truck-fast', roles: ['owner','admin','logistics'] },
    { path: '/kdsupport', name: 'Support', icon: 'fa-headset', roles: ['owner','admin','support'] },
    { path: '/kddashboard', name: 'Exec', icon: 'fa-chart-simple', roles: ['owner','admin','finance'] },
    { path: '/kdadmin', name: 'Inventory', icon: 'fa-boxes', roles: ['owner','admin','inventory_manager','warehouse'] },
    { path: '/kdteam', name: 'Team', icon: 'fa-users', roles: ['owner','admin'] },
    { path: '/kdknowledge', name: 'Knowledge', icon: 'fa-database', roles: ['owner','admin'] },
    { path: '/kdprocurement', name: 'Procurement', icon: 'fa-truck', roles: ['owner','admin','inventory_manager','procurement','warehouse'] },
    { path: '/kdhr', name: 'HR', icon: 'fa-users-gear', roles: ['owner','admin','hr','employee'] },
    { path: '/kdaccount', name: 'Accounts', icon: 'fa-book', roles: ['owner','admin','finance','auditor'] },
    { path: '/kdstorefront', name: 'Storefront', icon: 'fa-store', roles: ['owner','admin'] }
];
            const userRole = localStorage.getItem('user_role') || 'customer';
            const canAccess = (roles) => roles.includes(userRole);

            return (
                <div className="bg-[#1E3A5F] text-white shadow-md sticky top-0 z-40">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex flex-wrap items-center justify-between py-3 gap-3">
                            <div className="flex items-center gap-2">
                                <i className="fa-solid fa-chart-pie text-orange-400 text-xl"></i>
                                <span className="text-xl font-bold tracking-tight">Kevs<span className="text-orange-500">BI</span></span>
                                <span className="hidden sm:inline-block text-xs bg-white/20 px-2 py-0.5 rounded-full">bOS</span>
                            </div>
                            <div className="hidden md:flex items-center gap-1 flex-wrap">
                                {navItems.filter(item => canAccess(item.roles)).map(item => (
                                    <a key={item.path} href={item.path}
                                       className={`flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200 ${currentPath === item.path ? 'bg-white/20 text-white' : 'text-white/80 hover:bg-white/10'}`}>
                                        <i className={`fa-solid ${item.icon} w-4`}></i> {item.name}
                                    </a>
                                ))}
                            </div>
                            <div className="flex items-center gap-3">
                                <span className="text-xs bg-white/10 px-3 py-1.5 rounded-full hidden sm:inline-block">
                                    <i className="fa-regular fa-user mr-1"></i> <span>{escapeHtml(userName || 'User')}</span>
                                </span>
                                <button onClick={onLogout} className="bg-red-500/80 hover:bg-red-600 text-white text-sm px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                                    <i className="fa-solid fa-sign-out-alt"></i> <span className="hidden sm:inline">Logout</span>
                                </button>
                            </div>
                        </div>
                        <div className="md:hidden flex overflow-x-auto pb-2 gap-1 snap-x">
                            {navItems.filter(item => canAccess(item.roles)).map(item => (
                                <a key={item.path} href={item.path}
                                   className={`flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-all duration-200 whitespace-nowrap ${currentPath === item.path ? 'bg-white/20 text-white' : 'text-white/80 hover:bg-white/10'}`}>
                                    <i className={`fa-solid ${item.icon} w-4`}></i> {item.name}
                                </a>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // ================================================================
        // DATE FILTER BAR
        //
        // Because filtering is now server-side, this bar is purely
        // presentational + an onChange callback. It does not filter
        // anything itself. The parent handles the refetch.
        //
        // `count`   = rows the server returned for the current filter
        // `total`   = rows the server says match the filter (from count=exact)
        // `allTotal`= rows the server would return with no filter applied
        //             (only known after the first unfiltered fetch)
        // ================================================================
        const DateFilterBar = ({ filter, onChange, count, total, allTotal, loading }) => {
            const active = Boolean((filter && filter.from) || (filter && filter.to));
            return (
                <div className={`flex flex-wrap gap-3 items-end mb-4 p-3 rounded-lg border ${active ? 'bg-amber-50 border-amber-400 filter-active' : 'bg-gray-50 border-gray-200'}`}>
                    <div>
                        <label className="block text-xs text-gray-600 mb-1">
                            <i className="fa-regular fa-calendar mr-1"></i>From Date
                        </label>
                        <input
                            type="date"
                            className="border border-gray-300 rounded p-1.5 text-sm"
                            value={filter.from || ''}
                            onChange={e => onChange({ ...filter, from: e.target.value })}
                        />
                    </div>
                    <div>
                        <label className="block text-xs text-gray-600 mb-1">
                            <i className="fa-regular fa-calendar mr-1"></i>To Date
                        </label>
                        <input
                            type="date"
                            className="border border-gray-300 rounded p-1.5 text-sm"
                            value={filter.to || ''}
                            onChange={e => onChange({ ...filter, to: e.target.value })}
                        />
                    </div>
                    <button
                        onClick={() => onChange({ from: '', to: '' })}
                        className="bg-gray-300 hover:bg-gray-400 text-gray-800 px-3 py-1.5 rounded text-sm transition"
                        disabled={!active || loading}
                    >
                        <i className="fa-solid fa-times mr-1"></i> Clear
                    </button>
                    {typeof count === 'number' && (
                        <span className={`text-xs ml-auto px-2 py-1 rounded ${active ? 'bg-amber-200 text-amber-900' : 'bg-gray-200 text-gray-600'}`}>
                            {loading ? (
                                <><i className="fa-solid fa-spinner fa-spin mr-1"></i> Loading…</>
                            ) : (
                                <>
                                    {count < (total || 0)
                                        ? `Showing ${count.toLocaleString()} of ${(total || 0).toLocaleString()} matching record${total === 1 ? '' : 's'}`
                                        : `${(total || 0).toLocaleString()} matching record${total === 1 ? '' : 's'}`}
                                    {active && typeof allTotal === 'number' && (
                                        <span className="ml-2 text-amber-800/70">(of {allTotal.toLocaleString()} total)</span>
                                    )}
                                </>
                            )}
                        </span>
                    )}
                </div>
            );
        };

        // ================================================================
        // MODAL COMPONENTS
        // ================================================================

        const PaymentModal = ({ isOpen, onClose, onConfirm, title, arId }) => {
            const [amount, setAmount] = useState('');
            const [reference, setReference] = useState('');
            const [notes, setNotes] = useState('');
            const [loading, setLoading] = useState(false);

            if (!isOpen) return null;

            const handleSubmit = async () => {
                if (!amount || parseFloat(amount) <= 0) {
                    alert('Please enter a valid amount');
                    return;
                }
                setLoading(true);
                try {
                    await onConfirm(arId, { amount: parseFloat(amount), reference: reference || undefined, notes: notes || undefined });
                    onClose();
                } catch (err) {
                    alert('Payment failed: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <h3>{title || 'Register Payment'}</h3>
                        <label>Amount (₦)</label>
                        <input type="number" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} placeholder="0.00" />
                        <label>Reference (optional)</label>
                        <input type="text" value={reference} onChange={e => setReference(e.target.value)} placeholder="Payment reference" />
                        <label>Notes (optional)</label>
                        <textarea value={notes} onChange={e => setNotes(e.target.value)} placeholder="Notes" rows={2} />
                        <div className="btn-row">
                            <button className="btn-secondary" onClick={onClose}>Cancel</button>
                            <button className="btn-primary" onClick={handleSubmit} disabled={loading}>
                                {loading ? 'Processing...' : 'Register Payment'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CreateAccountModal = ({ isOpen, onClose, onConfirm }) => {
            const [code, setCode] = useState('');
            const [name, setName] = useState('');
            const [type, setType] = useState('asset');
            const [description, setDescription] = useState('');
            const [loading, setLoading] = useState(false);

            if (!isOpen) return null;

            const handleSubmit = async () => {
                if (!code || !name) {
                    alert('Code and Name are required');
                    return;
                }
                setLoading(true);
                try {
                    await onConfirm({ code, name, type, description: description || undefined });
                    onClose();
                } catch (err) {
                    alert('Failed to create account: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <h3>Create Chart of Account</h3>
                        <label>Account Code *</label>
                        <input type="text" value={code} onChange={e => setCode(e.target.value)} placeholder="e.g. 1000" />
                        <label>Account Name *</label>
                        <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Cash" />
                        <label>Account Type</label>
                        <select value={type} onChange={e => setType(e.target.value)}>
                            <option value="asset">Asset</option>
                            <option value="liability">Liability</option>
                            <option value="equity">Equity</option>
                            <option value="revenue">Revenue</option>
                            <option value="expense">Expense</option>
                        </select>
                        <label>Description (optional)</label>
                        <textarea value={description} onChange={e => setDescription(e.target.value)} placeholder="Description" rows={2} />
                        <div className="btn-row">
                            <button className="btn-secondary" onClick={onClose}>Cancel</button>
                            <button className="btn-primary" onClick={handleSubmit} disabled={loading}>
                                {loading ? 'Creating...' : 'Create Account'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const CreateJournalModal = ({ isOpen, onClose, onConfirm, accounts }) => {
            const [entryDate, setEntryDate] = useState(new Date().toISOString().slice(0,10));
            const [description, setDescription] = useState('');
            const [reference, setReference] = useState('');
            const [lines, setLines] = useState([{ account_id: '', debit: '', credit: '' }]);
            const [loading, setLoading] = useState(false);

            if (!isOpen) return null;

            const addLine = () => {
                setLines([...lines, { account_id: '', debit: '', credit: '' }]);
            };

            const removeLine = (idx) => {
                if (lines.length <= 1) return;
                setLines(lines.filter((_, i) => i !== idx));
            };

            const updateLine = (idx, field, value) => {
                const newLines = [...lines];
                newLines[idx][field] = value;
                if (field === 'debit' && value) newLines[idx].credit = '';
                if (field === 'credit' && value) newLines[idx].debit = '';
                setLines(newLines);
            };

            const handleSubmit = async () => {
                if (!description) {
                    alert('Description is required');
                    return;
                }
                const validLines = lines.filter(l => l.account_id && (parseFloat(l.debit) > 0 || parseFloat(l.credit) > 0));
                if (validLines.length === 0) {
                    alert('At least one valid line is required');
                    return;
                }
                const totalDebit = validLines.reduce((sum, l) => sum + (parseFloat(l.debit) || 0), 0);
                const totalCredit = validLines.reduce((sum, l) => sum + (parseFloat(l.credit) || 0), 0);
                if (Math.abs(totalDebit - totalCredit) > 0.01) {
                    alert(`Debits (${totalDebit}) and Credits (${totalCredit}) do not balance`);
                    return;
                }
                setLoading(true);
                try {
                    const payload = {
                        entry_date: entryDate,
                        description,
                        reference: reference || undefined,
                        lines: validLines.map(l => ({
                            account_id: l.account_id,
                            debit: parseFloat(l.debit) || 0,
                            credit: parseFloat(l.credit) || 0,
                        }))
                    };
                    await onConfirm(payload);
                    onClose();
                } catch (err) {
                    alert('Failed to create journal entry: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <h3>Create Journal Entry</h3>
                        <label>Entry Date</label>
                        <input type="date" value={entryDate} onChange={e => setEntryDate(e.target.value)} />
                        <label>Description *</label>
                        <input type="text" value={description} onChange={e => setDescription(e.target.value)} placeholder="Journal entry description" />
                        <label>Reference (optional)</label>
                        <input type="text" value={reference} onChange={e => setReference(e.target.value)} placeholder="e.g. INV-001" />

                        <label className="mt-3 font-medium">Journal Lines</label>
                        {lines.map((line, idx) => (
                            <div key={idx} className="line-row">
                                <select value={line.account_id} onChange={e => updateLine(idx, 'account_id', e.target.value)}>
                                    <option value="">Select Account</option>
                                    {accounts.map(acc => (
                                        <option key={acc.id} value={acc.id}>{acc.code} - {acc.name}</option>
                                    ))}
                                </select>
                                <input type="number" step="0.01" placeholder="Debit" value={line.debit} onChange={e => updateLine(idx, 'debit', e.target.value)} />
                                <input type="number" step="0.01" placeholder="Credit" value={line.credit} onChange={e => updateLine(idx, 'credit', e.target.value)} />
                                <button onClick={() => removeLine(idx)}><i className="fa-solid fa-times"></i></button>
                            </div>
                        ))}
                        <button onClick={addLine} className="text-blue-600 hover:underline text-sm mt-1">+ Add Line</button>

                        <div className="btn-row">
                            <button className="btn-secondary" onClick={onClose}>Cancel</button>
                            <button className="btn-primary" onClick={handleSubmit} disabled={loading}>
                                {loading ? 'Creating...' : 'Create Journal Entry'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ViewJournalModal = ({ isOpen, onClose, entry }) => {
            if (!isOpen || !entry) return null;

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <h3>Journal Entry Details</h3>
                        <p><strong>Date:</strong> {formatDate(entry.entry_date)}</p>
                        <p><strong>Description:</strong> {entry.description}</p>
                        <p><strong>Reference:</strong> {entry.reference || '-'}</p>
                        <p><strong>Status:</strong> {entry.status}</p>
                        <p><strong>Created:</strong> {formatDate(entry.created_at)}</p>
                        <hr className="my-3" />
                        <h4 className="font-semibold">Lines</h4>
                        <table className="min-w-full mt-2">
                            <thead className="bg-gray-100">
                                <tr><th className="p-2 text-left">Account</th><th className="p-2 text-right">Debit</th><th className="p-2 text-right">Credit</th></tr>
                            </thead>
                            <tbody>
                                {(entry.journal_lines || []).map((line, idx) => (
                                    <tr key={idx} className="border-b">
                                        <td className="p-2">{line.account_id}</td>
                                        <td className="p-2 text-right">{formatCurrency(line.debit)}</td>
                                        <td className="p-2 text-right">{formatCurrency(line.credit)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        <div className="btn-row">
                            <button className="btn-secondary" onClick={onClose}>Close</button>
                        </div>
                    </div>
                </div>
            );
        };

        // ================================================================
        // EXPENSES TAB
        //
        // Filters server-side. /expenses is served by expenses.py — see
        // the note in the response body for the backend patch.
        // ================================================================
        const ExpensesTab = () => {
            const [expenses, setExpenses] = useState([]);
            const [total, setTotal] = useState(0);
            const [allTotal, setAllTotal] = useState(0);
            const [loading, setLoading] = useState(false);
            const [dateFilter, setDateFilter] = useState({ from: '', to: '' });
            const [form, setForm] = useState({ expense_date: new Date().toISOString().slice(0,10), category: '', amount: '', payment_method: 'cash', vendor: '', description: '' });

            const buildUrl = (filter) => {
                const params = new URLSearchParams();
                if (filter.from) params.set('from_date', filter.from);
                if (filter.to) params.set('to_date', filter.to);
                params.set('limit', String(PAGE_SIZE));
                return `/expenses?${params.toString()}`;
            };

            const fetchExpenses = async (filter) => {
                setLoading(true);
                try {
                    const res = await apiCall(buildUrl(filter));
                    setExpenses(res.expenses || []);
                    setTotal(typeof res.total === 'number' ? res.total : (res.expenses || []).length);
                    // If we got a filter-less fetch, this is the true
                    // unfiltered total. Persist it for the "N of M" hint.
                    if (!filter.from && !filter.to) {
                        setAllTotal(res.total || 0);
                    }
                } catch (err) {
                    console.warn('expenses fetch failed', err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchExpenses(dateFilter); }, []);

            const handleFilterChange = (newFilter) => {
                setDateFilter(newFilter);
                fetchExpenses(newFilter);
            };

            const filteredTotalSum = useMemo(
                () => expenses.reduce((sum, ex) => sum + (Number(ex.amount) || 0), 0),
                [expenses]
            );

            const handleSubmit = async (e) => {
                e.preventDefault();
                try {
                    await apiCall('/expenses', { method: 'POST', body: JSON.stringify({ ...form, amount: parseFloat(form.amount) }) });
                    fetchExpenses(dateFilter);
                    alert('Expense recorded!');
                } catch (err) { alert(err.message); }
            };

            return (
                <div className="bg-white p-4 rounded shadow">
                    <h2 className="text-xl font-semibold mb-4">Record Expense</h2>
                    <form onSubmit={handleSubmit} className="grid grid-cols-2 gap-4 mb-6">
                        <input type="date" className="border p-2 rounded" value={form.expense_date} onChange={e => setForm({...form, expense_date: e.target.value})} required />
                        <input type="text" placeholder="Category (e.g. Utilities, Rent)" className="border p-2 rounded" value={form.category} onChange={e => setForm({...form, category: e.target.value})} required />
                        <input type="number" placeholder="Amount (₦)" className="border p-2 rounded" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} required />
                        <select className="border p-2 rounded" value={form.payment_method} onChange={e => setForm({...form, payment_method: e.target.value})}>
                            <option value="cash">Cash</option>
                            <option value="bank_transfer">Bank Transfer</option>
                            <option value="card">Card</option>
                            <option value="credit">Credit (A/P)</option>
                        </select>
                        <input type="text" placeholder="Vendor" className="border p-2 rounded col-span-2" value={form.vendor} onChange={e => setForm({...form, vendor: e.target.value})} />
                        <button type="submit" className="bg-blue-600 text-white p-2 rounded col-span-2 hover:bg-blue-700">Save Expense</button>
                    </form>

                    <h3 className="text-lg font-semibold mb-2">Recent Expenses</h3>

                    <DateFilterBar
                        filter={dateFilter}
                        onChange={handleFilterChange}
                        count={expenses.length}
                        total={total}
                        allTotal={allTotal}
                        loading={loading}
                    />

                    <div className="table-scroll">
                        <table className="min-w-full">
                            <thead className="sticky top-0 bg-gray-100">
                                <tr>
                                    <th className="p-2 text-left">Date</th>
                                    <th className="p-2 text-left">Category</th>
                                    <th className="p-2 text-left">Amount</th>
                                    <th className="p-2 text-left">Method</th>
                                </tr>
                            </thead>
                            <tbody>
                                {expenses.map(ex => (
                                    <tr key={ex.id} className="border-b">
                                        <td className="p-2">{ex.expense_date}</td>
                                        <td className="p-2">{ex.category}</td>
                                        <td className="p-2">{formatCurrency(ex.amount)}</td>
                                        <td className="p-2 capitalize">{ex.payment_method ? ex.payment_method.replace('_', ' ') : '-'}</td>
                                    </tr>
                                ))}
                                {expenses.length === 0 && !loading && (
                                    <tr>
                                        <td colSpan="4" className="text-center p-4 text-gray-400">
                                            {(dateFilter.from || dateFilter.to)
                                                ? 'No expenses in this date range'
                                                : 'No expenses yet'}
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                            {expenses.length > 0 && (
                                <tfoot>
                                    <tr className="bg-gray-50 font-semibold">
                                        <td className="p-2" colSpan="2">Total (filtered)</td>
                                        <td className="p-2">{formatCurrency(filteredTotalSum)}</td>
                                        <td className="p-2"></td>
                                    </tr>
                                </tfoot>
                            )}
                        </table>
                    </div>
                </div>
            );
        };

        // ================================================================
        // MAIN APP
        // ================================================================
        const App = () => {
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [userName, setUserName] = useState('User');

            const [activeTab, setActiveTab] = useState('pl');

            const [chartAccounts, setChartAccounts] = useState([]);

            // ── Journal Entries ──
            // `journalEntries` is always exactly what the server returned
            // for the current `journalDateFilter`. `journalTotal` is the
            // total matching that filter (from count=exact).
            // `journalAllTotal` is the unfiltered total — set once on
            // mount and left alone so the "N of M" hint stays correct.
            const [journalEntries, setJournalEntries] = useState([]);
            const [journalTotal, setJournalTotal] = useState(0);
            const [journalAllTotal, setJournalAllTotal] = useState(0);
            const [journalDateFilter, setJournalDateFilter] = useState({ from: '', to: '' });
            const [journalLoading, setJournalLoading] = useState(false);

            // ── A/R ──
            const [arList, setArList] = useState([]);
            const [arTotal, setArTotal] = useState(0);
            const [arAllTotal, setArAllTotal] = useState(0);
            const [arDateFilter, setArDateFilter] = useState({ from: '', to: '' });
            const [arLoading, setArLoading] = useState(false);

            // ── A/P ──
            const [apList, setApList] = useState([]);
            const [apTotal, setApTotal] = useState(0);
            const [apAllTotal, setApAllTotal] = useState(0);
            const [apDateFilter, setApDateFilter] = useState({ from: '', to: '' });
            const [apLoading, setApLoading] = useState(false);

            const [plSummary, setPlSummary] = useState(null);
            const [plPeriod, setPlPeriod] = useState({ start: '', end: '' });

            const [fetching, setFetching] = useState(false);
            const [error, setError] = useState('');

            const [showPaymentModal, setShowPaymentModal] = useState(false);
            const [paymentTarget, setPaymentTarget] = useState(null);
            const [paymentType, setPaymentType] = useState('ar');

            const [showAccountModal, setShowAccountModal] = useState(false);
            const [showJournalModal, setShowJournalModal] = useState(false);
            const [showViewJournal, setShowViewJournal] = useState(false);
            const [viewingEntry, setViewingEntry] = useState(null);

            // ── Bootstrap session ──
            useEffect(() => {
                (async () => {
                    try {
                        const s = await KD.session.ensure({ requireBranch: true });
                        if (!s) {
                            window.location.href = '/kdsiginin';
                            return;
                        }
                        setSession(s);
                        setUserName(
                            s.user?.display_name ||
                            s.user?.first_name ||
                            s.user?.email ||
                            'User'
                        );
                        localStorage.setItem('user_role', s.role || 'customer');
                    } catch (err) {
                        console.error('[kdaccount] session bootstrap failed', err);
                        window.location.href = '/kdsiginin';
                    } finally {
                        setLoading(false);
                    }
                })();
            }, []);

            useEffect(() => {
                if (session) fetchAllData();
            }, [session]);

            const handleSwitch = async () => {
                const next = await KD.session.switch({ requireBranch: true });
                if (next) window.location.reload();
            };

            const handleLogout = async () => {
                try {
                    await fetch(`${API_BASE}/auth/logout`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${getToken()}`, 'Content-Type': 'application/json' }
                    });
                } catch (e) {}
                localStorage.clear();
                window.location.href = '/kdsiginin';
            };

            // ── URL builders (server-side filtering) ──
            const buildJournalUrl = (filter) => {
                const p = new URLSearchParams();
                if (filter.from) p.set('from_date', filter.from);
                if (filter.to) p.set('to_date', filter.to);
                p.set('limit', String(PAGE_SIZE));
                return `/accounts/journal-entries?${p.toString()}`;
            };

            const buildArUrl = (filter) => {
                const p = new URLSearchParams();
                if (filter.from) p.set('from_date', filter.from);
                if (filter.to) p.set('to_date', filter.to);
                p.set('limit', String(PAGE_SIZE));
                return `/accounts/ar?${p.toString()}`;
            };

            const buildApUrl = (filter) => {
                const p = new URLSearchParams();
                if (filter.from) p.set('from_date', filter.from);
                if (filter.to) p.set('to_date', filter.to);
                p.set('limit', String(PAGE_SIZE));
                return `/accounts/ap?${p.toString()}`;
            };

            // ── Per-entity fetch functions ──
            const fetchJournal = async (filter) => {
                setJournalLoading(true);
                try {
                    const res = await apiCall(buildJournalUrl(filter));
                    setJournalEntries(res.entries || []);
                    setJournalTotal(typeof res.total === 'number' ? res.total : (res.entries || []).length);
                    if (!filter.from && !filter.to) {
                        setJournalAllTotal(res.total || 0);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setJournalLoading(false);
                }
            };

            const fetchAR = async (filter) => {
                setArLoading(true);
                try {
                    const res = await apiCall(buildArUrl(filter));
                    setArList(res.ar || []);
                    setArTotal(typeof res.total === 'number' ? res.total : (res.ar || []).length);
                    if (!filter.from && !filter.to) {
                        setArAllTotal(res.total || 0);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setArLoading(false);
                }
            };

            const fetchAP = async (filter) => {
                setApLoading(true);
                try {
                    const res = await apiCall(buildApUrl(filter));
                    setApList(res.ap || []);
                    setApTotal(typeof res.total === 'number' ? res.total : (res.ap || []).length);
                    if (!filter.from && !filter.to) {
                        setApAllTotal(res.total || 0);
                    }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setApLoading(false);
                }
            };

            const fetchAllData = async () => {
                if (!session) return;
                setFetching(true);
                setError('');
                try {
                    const coa = await apiCall('/accounts/chart');
                    setChartAccounts(coa.accounts || []);

                    await Promise.all([
                        fetchJournal(journalDateFilter),
                        fetchAR(arDateFilter),
                        fetchAP(apDateFilter),
                    ]);

                    const today = new Date();
                    const end = today.toISOString().slice(0,10);
                    const start = new Date(today.setDate(today.getDate()-30)).toISOString().slice(0,10);
                    setPlPeriod({ start, end });
                    try {
                        const summary = await apiCall(`/accounts/profit-loss/summary?period_start=${start}&period_end=${end}`);
                        setPlSummary(summary);
                    } catch (e) { setPlSummary(null); }
                } catch (err) {
                    setError(err.message);
                } finally {
                    setFetching(false);
                }
            };

            // ── Filter change handlers ──
            const handleJournalFilterChange = (newFilter) => {
                setJournalDateFilter(newFilter);
                fetchJournal(newFilter);
            };

            const handleArFilterChange = (newFilter) => {
                setArDateFilter(newFilter);
                fetchAR(newFilter);
            };

            const handleApFilterChange = (newFilter) => {
                setApDateFilter(newFilter);
                fetchAP(newFilter);
            };

            // ── Actions ──
            const createAccount = async (data) => {
                await apiCall('/accounts/chart', { method: 'POST', body: JSON.stringify(data) });
                await fetchAllData();
            };

            const deleteAccount = async (id) => {
                if (!confirm('Delete this account?')) return;
                await apiCall(`/accounts/chart/${id}`, { method: 'DELETE' });
                await fetchAllData();
            };

            const createJournal = async (data) => {
                await apiCall('/accounts/journal-entries', { method: 'POST', body: JSON.stringify(data) });
                await fetchJournal(journalDateFilter);
            };

            const postJournal = async (id) => {
                if (!confirm('Post this journal entry?')) return;
                await apiCall(`/accounts/journal-entries/${id}/post`, { method: 'POST' });
                await fetchJournal(journalDateFilter);
            };

            const deleteJournal = async (id) => {
                if (!confirm('Delete this journal entry?')) return;
                await apiCall(`/accounts/journal-entries/${id}`, { method: 'DELETE' });
                await fetchJournal(journalDateFilter);
            };

            const registerPayment = async (id, data) => {
                const endpoint = paymentType === 'ar' ? `/accounts/ar/${id}/payment` : `/accounts/ap/${id}/payment`;
                await apiCall(endpoint, { method: 'POST', body: JSON.stringify(data) });
                if (paymentType === 'ar') await fetchAR(arDateFilter);
                else await fetchAP(apDateFilter);
            };

            const openPaymentModal = (id, type) => {
                setPaymentTarget(id);
                setPaymentType(type);
                setShowPaymentModal(true);
            };

            const exportData = async (entity, format) => {
                try {
                    const body = { entity, format, period_start: plPeriod.start || undefined, period_end: plPeriod.end || undefined };
                    const response = await fetch(`${API_BASE}/accounts/export`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${getToken()}`,
                        },
                        body: JSON.stringify(body)
                    });
                    if (!response.ok) {
                        const err = await response.text();
                        throw new Error(err);
                    }
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${entity}.${format}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                } catch (err) {
                    alert('Export failed: ' + err.message);
                }
            };

            const triggerSync = async () => {
                try {
                    await apiCall('/accounts/sync-webhook', { method: 'POST' });
                    alert('Sync webhook triggered successfully');
                } catch (err) {
                    alert('Sync failed: ' + err.message);
                }
            };

            const generatePL = async () => {
                if (!plPeriod.start || !plPeriod.end) {
                    alert('Please set start and end dates');
                    return;
                }
                setFetching(true);
                try {
                    const result = await apiCall('/accounts/profit-loss', {
                        method: 'POST',
                        body: JSON.stringify({ period_start: plPeriod.start, period_end: plPeriod.end })
                    });
                    setPlSummary(result.profit_loss);
                    alert('Profit & Loss generated successfully');
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    setFetching(false);
                }
            };

            // ================================================================
            // RENDER
            // ================================================================

            const renderPLTab = () => (
                <div>
                    <div className="bg-white p-4 rounded shadow mb-4">
                        <h2 className="text-xl font-semibold mb-3">Profit & Loss Statement</h2>
                        <div className="flex flex-wrap gap-4 items-end mb-4">
                            <div>
                                <label className="block text-sm">Start Date</label>
                                <input type="date" className="border rounded p-2"
                                       value={plPeriod.start} onChange={e => setPlPeriod({...plPeriod, start: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-sm">End Date</label>
                                <input type="date" className="border rounded p-2"
                                       value={plPeriod.end} onChange={e => setPlPeriod({...plPeriod, end: e.target.value})} />
                            </div>
                            <button onClick={generatePL} className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                                Generate P&L
                            </button>
                        </div>
                        {plSummary ? (
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="bg-gray-100 p-3 rounded"><span className="text-sm text-gray-600">Revenue</span><div className="text-lg font-bold">{formatCurrency(plSummary.revenue)}</div></div>
                                <div className="bg-gray-100 p-3 rounded"><span className="text-sm text-gray-600">COGS</span><div className="text-lg font-bold">{formatCurrency(plSummary.cogs)}</div></div>
                                <div className="bg-gray-100 p-3 rounded"><span className="text-sm text-gray-600">Gross Profit</span><div className="text-lg font-bold">{formatCurrency(plSummary.gross_profit)}</div></div>
                                <div className="bg-gray-100 p-3 rounded"><span className="text-sm text-gray-600">Net Income</span><div className="text-lg font-bold">{formatCurrency(plSummary.net_income)}</div></div>
                            </div>
                        ) : (
                            <p className="text-gray-500">No P&L summary for this period. Click Generate.</p>
                        )}
                    </div>
                </div>
            );

            const renderCOATab = () => (
                <div className="bg-white p-4 rounded shadow">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-semibold">Chart of Accounts</h2>
                        <button onClick={() => setShowAccountModal(true)} className="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">
                            <i className="fa-solid fa-plus mr-1"></i> New Account
                        </button>
                    </div>
                    <div className="table-scroll">
                        <table className="min-w-full">
                            <thead className="sticky top-0 bg-gray-200">
                                <tr>
                                    <th className="p-2 text-left">Code</th>
                                    <th className="p-2 text-left">Name</th>
                                    <th className="p-2 text-left">Type</th>
                                    <th className="p-2 text-left">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {chartAccounts.map(acc => (
                                    <tr key={acc.id} className="border-b">
                                        <td className="p-2">{acc.code}</td>
                                        <td className="p-2">{acc.name}</td>
                                        <td className="p-2 capitalize">{acc.type}</td>
                                        <td className="p-2">
                                            <button className="text-red-600 hover:underline" onClick={() => deleteAccount(acc.id)}>Delete</button>
                                        </td>
                                    </tr>
                                ))}
                                {chartAccounts.length === 0 && <tr><td colSpan="4" className="text-center p-4 text-gray-400">No accounts</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    <CreateAccountModal
                        isOpen={showAccountModal}
                        onClose={() => setShowAccountModal(false)}
                        onConfirm={createAccount}
                    />
                </div>
            );

            const renderJournalTab = () => (
                <div className="bg-white p-4 rounded shadow">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-xl font-semibold">Journal Entries</h2>
                        <button onClick={() => setShowJournalModal(true)} className="bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700">
                            <i className="fa-solid fa-plus mr-1"></i> New Entry
                        </button>
                    </div>

                    <DateFilterBar
                        filter={journalDateFilter}
                        onChange={handleJournalFilterChange}
                        count={journalEntries.length}
                        total={journalTotal}
                        allTotal={journalAllTotal}
                        loading={journalLoading}
                    />

                    <div className="table-scroll">
                        <table className="min-w-full">
                            <thead className="sticky top-0 bg-gray-200">
                                <tr>
                                    <th className="p-2 text-left">Date</th>
                                    <th className="p-2 text-left">Description</th>
                                    <th className="p-2 text-left">Reference</th>
                                    <th className="p-2 text-left">Status</th>
                                    <th className="p-2 text-left">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                {journalEntries.map(je => (
                                    <tr key={je.id} className="border-b">
                                        <td className="p-2">{formatDate(je.entry_date)}</td>
                                        <td className="p-2">{je.description}</td>
                                        <td className="p-2">{je.reference || '-'}</td>
                                        <td className="p-2">
                                            <span className={`px-2 py-0.5 rounded text-xs ${je.status === 'posted' ? 'bg-green-200 text-green-800' : je.status === 'draft' ? 'bg-yellow-200 text-yellow-800' : 'bg-gray-200'}`}>
                                                {je.status}
                                            </span>
                                        </td>
                                        <td className="p-2">
                                            {je.status === 'draft' && (
                                                <button className="text-blue-600 hover:underline mr-2" onClick={() => postJournal(je.id)}>Post</button>
                                            )}
                                            <button className="text-blue-600 hover:underline mr-2" onClick={() => { setViewingEntry(je); setShowViewJournal(true); }}>View</button>
                                            <button className="text-red-600 hover:underline" onClick={() => deleteJournal(je.id)}>Delete</button>
                                        </td>
                                    </tr>
                                ))}
                                {journalEntries.length === 0 && !journalLoading && (
                                    <tr>
                                        <td colSpan="5" className="text-center p-4 text-gray-400">
                                            {journalAllTotal === 0
                                                ? 'No entries'
                                                : 'No entries match this date range'}
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                    <CreateJournalModal
                        isOpen={showJournalModal}
                        onClose={() => setShowJournalModal(false)}
                        onConfirm={createJournal}
                        accounts={chartAccounts}
                    />
                    <ViewJournalModal
                        isOpen={showViewJournal}
                        onClose={() => { setShowViewJournal(false); setViewingEntry(null); }}
                        entry={viewingEntry}
                    />
                </div>
            );

            const renderARTab = () => (
                <div className="bg-white p-4 rounded shadow">
                    <h2 className="text-xl font-semibold mb-4">Accounts Receivable</h2>

                    <DateFilterBar
                        filter={arDateFilter}
                        onChange={handleArFilterChange}
                        count={arList.length}
                        total={arTotal}
                        allTotal={arAllTotal}
                        loading={arLoading}
                    />

                    <div className="table-scroll">
                        <table className="min-w-full">
                            <thead className="sticky top-0 bg-gray-200">
                                <tr>
                                    <th className="p-2 text-left">Sale</th>
                                    <th className="p-2 text-left">Amount</th>
                                    <th className="p-2 text-left">Paid</th>
                                    <th className="p-2 text-left">Due Date</th>
                                    <th className="p-2 text-left">Status</th>
                                    <th className="p-2 text-left">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {arList.map(ar => (
                                    <tr key={ar.id} className="border-b">
                                        <td className="p-2">{ar.sale_id?.slice(0,8) || '-'}</td>
                                        <td className="p-2">{formatCurrency(ar.amount)}</td>
                                        <td className="p-2">{formatCurrency(ar.paid_amount)}</td>
                                        <td className="p-2">{formatDate(ar.due_date)}</td>
                                        <td className="p-2">
                                            <span className={`px-2 py-0.5 rounded text-xs ${ar.status === 'paid' ? 'bg-green-200 text-green-800' : ar.status === 'overdue' ? 'bg-red-200 text-red-800' : 'bg-yellow-200 text-yellow-800'}`}>
                                                {ar.status}
                                            </span>
                                        </td>
                                        <td className="p-2">
                                            {ar.status !== 'paid' && (
                                                <button className="text-blue-600 hover:underline" onClick={() => openPaymentModal(ar.id, 'ar')}>
                                                    Register Payment
                                                </button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                                {arList.length === 0 && !arLoading && (
                                    <tr>
                                        <td colSpan="6" className="text-center p-4 text-gray-400">
                                            {arAllTotal === 0
                                                ? 'No A/R records'
                                                : 'No A/R records with due dates in this range'}
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                    <PaymentModal
                        isOpen={showPaymentModal}
                        onClose={() => { setShowPaymentModal(false); setPaymentTarget(null); }}
                        onConfirm={registerPayment}
                        title={paymentType === 'ar' ? 'Register A/R Payment' : 'Register A/P Payment'}
                        arId={paymentTarget}
                    />
                </div>
            );

            const renderAPTab = () => (
                <div className="bg-white p-4 rounded shadow">
                    <h2 className="text-xl font-semibold mb-4">Accounts Payable</h2>

                    <DateFilterBar
                        filter={apDateFilter}
                        onChange={handleApFilterChange}
                        count={apList.length}
                        total={apTotal}
                        allTotal={apAllTotal}
                        loading={apLoading}
                    />

                    <div className="table-scroll">
                        <table className="min-w-full">
                            <thead className="sticky top-0 bg-gray-200">
                                <tr>
                                    <th className="p-2 text-left">Supplier</th>
                                    <th className="p-2 text-left">Amount</th>
                                    <th className="p-2 text-left">Paid</th>
                                    <th className="p-2 text-left">Due Date</th>
                                    <th className="p-2 text-left">Status</th>
                                    <th className="p-2 text-left">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {apList.map(ap => (
                                    <tr key={ap.id} className="border-b">
                                        <td className="p-2">{ap.supplier_id?.slice(0,8) || '-'}</td>
                                        <td className="p-2">{formatCurrency(ap.amount)}</td>
                                        <td className="p-2">{formatCurrency(ap.paid_amount)}</td>
                                        <td className="p-2">{formatDate(ap.due_date)}</td>
                                        <td className="p-2">
                                            <span className={`px-2 py-0.5 rounded text-xs ${ap.status === 'paid' ? 'bg-green-200 text-green-800' : ap.status === 'overdue' ? 'bg-red-200 text-red-800' : 'bg-yellow-200 text-yellow-800'}`}>
                                                {ap.status}
                                            </span>
                                        </td>
                                        <td className="p-2">
                                            {ap.status !== 'paid' && (
                                                <button className="text-blue-600 hover:underline" onClick={() => openPaymentModal(ap.id, 'ap')}>
                                                    Register Payment
                                                </button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                                {apList.length === 0 && !apLoading && (
                                    <tr>
                                        <td colSpan="6" className="text-center p-4 text-gray-400">
                                            {apAllTotal === 0
                                                ? 'No A/P records'
                                                : 'No A/P records with due dates in this range'}
                                        </td>
                                    </tr>
                                )}
                            </tbody>
                        </table>
                    </div>
                    <PaymentModal
                        isOpen={showPaymentModal}
                        onClose={() => { setShowPaymentModal(false); setPaymentTarget(null); }}
                        onConfirm={registerPayment}
                        title={paymentType === 'ar' ? 'Register A/R Payment' : 'Register A/P Payment'}
                        arId={paymentTarget}
                    />
                </div>
            );

            const renderExportTab = () => (
                <div className="bg-white p-4 rounded shadow">
                    <h2 className="text-xl font-semibold mb-4">Export & Sync</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="border p-4 rounded">
                            <h3 className="font-medium mb-2">Export Data</h3>
                            <p className="text-xs text-gray-500 mb-2">
                                Uses the P&L period dates above as the export window.
                                Each entity filters on its own natural date
                                (A/R & A/P by due_date, journal by entry_date).
                            </p>
                            <div className="flex flex-wrap gap-2">
                                <button onClick={() => exportData('accounts_receivable', 'csv')} className="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">A/R CSV</button>
                                <button onClick={() => exportData('accounts_payable', 'csv')} className="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">A/P CSV</button>
                                <button onClick={() => exportData('journal_entries', 'csv')} className="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">Journal CSV</button>
                                <button onClick={() => exportData('profit_loss', 'csv')} className="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">P&L CSV</button>
                                <button onClick={() => exportData('accounts_receivable', 'json')} className="bg-green-600 text-white px-3 py-1 rounded text-sm hover:bg-green-700">JSON</button>
                            </div>
                        </div>
                        <div className="border p-4 rounded">
                            <h3 className="font-medium mb-2">Sync with External System</h3>
                            <p className="text-sm text-gray-600 mb-2">Trigger a webhook to sync data to Sage, QuickBooks, etc.</p>
                            <button onClick={triggerSync} className="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700">
                                <i className="fa-solid fa-rotate mr-1"></i> Trigger Sync
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderTabContent = () => {
                switch (activeTab) {
                    case 'pl': return renderPLTab();
                    case 'coa': return renderCOATab();
                    case 'journal': return renderJournalTab();
                    case 'ar': return renderARTab();
                    case 'ap': return renderAPTab();
                    case 'expenses': return <ExpensesTab />;
                    case 'export': return renderExportTab();
                    default: return <p>Select a tab</p>;
                }
            };

            if (loading) {
                return <div className="flex justify-center items-center h-screen"><div className="loading-spinner"></div></div>;
            }

            const bannerOrgLabel = session
                ? (session.orgName || `Org ${(session.orgId || '').slice(0, 8)}`)
                : '';

            return (
                <div>
                    <NavBar onLogout={handleLogout} userName={userName} />
                    <div className="max-w-7xl mx-auto p-4 mt-4">
                        {session && (
                            <div className="mb-4 p-3 bg-blue-900/30 rounded-lg border border-blue-700 flex items-center justify-between" style={{background:'#1e293b', borderColor:'#334155'}}>
                                <div className="flex items-center gap-3">
                                    <i className="fa-solid fa-building text-blue-400"></i>
                                    <div>
                                        <p className="text-xs text-slate-400">Currently viewing accounting data for</p>
                                        <p className="font-semibold text-white">
                                            {bannerOrgLabel}
                                            {session.branchName && (
                                                <span className="text-slate-400 font-normal"> · {session.branchName}</span>
                                            )}
                                        </p>
                                    </div>
                                </div>
                                <button onClick={handleSwitch} className="text-sm bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg transition text-white">
                                    <i className="fa-solid fa-arrow-right-arrow-left mr-1"></i> Switch
                                </button>
                            </div>
                        )}

                        {error && <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">{error}</div>}

                        <div className="flex flex-wrap gap-2 border-b border-gray-300 mb-4">
                            {['pl','coa','journal','ar','ap','expenses','export'].map(tab => (
                                <button
                                    key={tab}
                                    className={`px-4 py-2 rounded-t-lg font-medium transition ${activeTab === tab ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                    onClick={() => setActiveTab(tab)}
                                >
                                    {tab === 'pl' && 'P&L'}
                                    {tab === 'coa' && 'Chart of Accounts'}
                                    {tab === 'journal' && 'Journal Entries'}
                                    {tab === 'ar' && 'A/R'}
                                    {tab === 'ap' && 'A/P'}
                                    {tab === 'expenses' && 'Expenses'}
                                    {tab === 'export' && 'Export & Sync'}
                                </button>
                            ))}
                        </div>

                        {fetching ? (
                            <div className="flex justify-center py-8"><div className="loading-spinner"></div></div>
                        ) : (
                            renderTabContent()
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
