<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LogiFlow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="/nav.js" defer></script>
    <script>
      // Central Auth Guard: Kick to global login if no token exists
      if (!localStorage.getItem('access_token') && window.location.pathname !== '/kdsiginin') {
        window.location.href = '/kdsiginin';
      }
    </script>
  </head>
  <body>
    <div id="kevs-nav-container"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
