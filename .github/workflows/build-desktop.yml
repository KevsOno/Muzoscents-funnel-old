name: Build Tauri App

on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag like v1.0.0
  workflow_dispatch: # Allows you to click "Run workflow" manually in GitHub

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Build
          - platform: 'windows-latest'
            args: ''
          # macOS Build (Universal binary for Intel + Apple Silicon)
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          # Add any macOS specific dependencies here if needed in the future

      - name: Install frontend dependencies
        run: |
          # If you have a package.json, use npm ci or npm install
          # If not, you can remove this step
          npm ci || true

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The path to your Tauri project folder relative to the repo root
          projectPath: './desktop'
          # The command used to build the frontend (if you have one)
          # Since you use a stub, this is just a placeholder
          args: ${{ matrix.args }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-installers-${{ matrix.platform }}
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/nsis/*.exe
